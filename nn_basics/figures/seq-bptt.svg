<text x="186" y="198" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">forward prop</text>
<text x="542" y="248" font-size="9.5" text-anchor="middle" fill="#dc2626" font-weight="600">backprop</text>
<line x1="48" y1="352" x2="872" y2="352" stroke="#9ca3af" stroke-width="1"/>
<rect x="160" y="372" width="600" height="44" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="460" y="400" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">L  =  Σ  L&lt;t&gt;(y-hat&lt;t&gt;, y&lt;t&gt;)      with  L&lt;t&gt; = −y&lt;t&gt; log y-hat&lt;t&gt; − (1−y&lt;t&gt;) log(1−y-hat&lt;t&gt;)</text>
<text x="460" y="442" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The load-bearing message is the red one along the activations: it runs backwards through t, which is where the name comes from.</text>
<text x="460" y="458" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Frameworks do this for you; the shape of the graph is what matters.</text>
