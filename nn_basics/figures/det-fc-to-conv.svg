<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="270" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">A fully connected layer is a convolution whose filter covers the whole volume</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">same numbers, different bookkeeping — each of the 400 values is still an arbitrary linear function of the whole 5×5×16 input</text>
<rect x="30" y="92" width="12.8583" height="72" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="36.4291" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">14×14×3</text>
<text x="36.4291" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="184.816" y="98.8403" width="16.0735" height="58.3194" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="192.852" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">10×10×16</text>
<text x="192.852" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV 5×5</text>
<rect x="342.846" y="108.038" width="16.0735" height="39.9234" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="350.883" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">5×5×16</text>
<text x="350.883" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">POOL 2×2</text>
<rect x="500.877" y="116.582" width="46" height="22.8365" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="523.877" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">1×1×400</text>
<text x="523.877" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV 5×5 ×400</text>
<rect x="688.834" y="116.582" width="46" height="22.8365" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="711.834" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">1×1×400</text>
<text x="711.834" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">1×1 ×400</text>
<rect x="876.792" y="116.582" width="13.2084" height="22.8365" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="883.396" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">1×1×4</text>
<text x="883.396" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">softmax</text>
<line x1="46.8583" y1="128" x2="180.816" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="113.837" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">16 filters</text>
<text x="113.837" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">5×5</text>
<line x1="204.889" y1="128" x2="338.846" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="271.868" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">max pool</text>
<text x="271.868" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">f=2, s=2</text>
<line x1="362.92" y1="128" x2="496.877" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="429.898" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">was FC 400</text>
<text x="429.898" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">now 400 filters</text>
<line x1="550.877" y1="128" x2="684.834" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="617.856" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">was FC 400</text>
<text x="617.856" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">now 1×1 ×400</text>
<line x1="738.834" y1="128" x2="872.792" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="805.813" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">4 filters</text>
<text x="805.813" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">+ softmax</text>
<rect x="30" y="219" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="46" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input</text>
<rect x="102.55" y="219" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="118.55" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">CONV</text>
<rect x="168.59" y="219" width="11" height="11" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="184.59" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">POOL</text>
<rect x="234.63" y="219" width="11" height="11" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.1"/>
<text x="250.63" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="320.2" y="219" width="11" height="11" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.1"/>
<text x="336.2" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">FC</text>
<rect x="373.22" y="219" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="389.22" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">softmax / ReLU</text>
<text x="460" y="254" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">A 5×5×16 filter over a 5×5×16 volume produces one number. 400 of them produce 1×1×400, which is exactly what the dense layer computed.</text>
</g>
</svg>
