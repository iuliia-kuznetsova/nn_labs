<text x="217" y="154" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">ConvNet</text>
<line x1="266" y1="150" x2="304" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="308" y="118" width="112" height="64" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="364" y="138" font-size="10" text-anchor="middle" fill="#111827" font-weight="normal">softmax</text>
<text x="364" y="151" font-size="10" text-anchor="middle" fill="#111827" font-weight="normal">Kian / Danielle /</text>
<text x="364" y="164" font-size="10" text-anchor="middle" fill="#111827" font-weight="normal">Younes / Tian / none</text>
<text x="241" y="228" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="normal">one example per class  ·  retrain when K grows</text>
<rect x="474" y="68" width="410" height="178" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="679" y="92" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">Similarity function  d</text>
