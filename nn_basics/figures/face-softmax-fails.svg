<rect x="692" y="128" width="160" height="44" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="772" y="154" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">d(x₁, x₂)  ≷  τ</text>
<text x="679" y="228" font-size="10.5" text-anchor="middle" fill="#16a34a" font-weight="normal">any pair  ·  new people just get added to the database</text>
<text x="460" y="282" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Learn d once. At test time you never update the network — you only compare encodings.</text>
