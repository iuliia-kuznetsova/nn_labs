<rect width="840" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="420" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Coordinates are relative to the assigned cell</text>
<text x="420" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the midpoint stays inside the cell; the box itself may spill out</text>
<rect x="80" y="90" width="140" height="140" rx="0" fill="#f9fafb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="220" y="90" width="140" height="140" rx="0" fill="#f9fafb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="80" y="230" width="140" height="140" rx="0" fill="#fef3c7" stroke="#6b7280" stroke-width="1.3"/>
<rect x="220" y="230" width="140" height="140" rx="0" fill="#f9fafb" stroke="#6b7280" stroke-width="1.3"/>
<text x="150" y="248" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">(0, 0)</text>
<text x="186" y="358" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">(1, 1)</text>
<text x="150" y="296" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="600">assigned cell</text>
<rect x="45" y="212.5" width="224" height="161" rx="2" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<rect x="45" y="196.5" width="36" height="16" rx="2" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<text x="51" y="208.5" font-size="10" text-anchor="start" fill="#ffffff" font-weight="600">car</text>
<circle cx="157" cy="293" r="4.2" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<text x="169" y="283" font-size="11" text-anchor="start" fill="#dc2626" font-weight="600">(bx, by) ∈ [0, 1]</text>
<text x="157" y="391.5" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">bh, bw can be &gt; 1</text>
<rect x="430" y="90" width="370" height="188" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="448" y="118" font-size="13" text-anchor="start" fill="#111827" font-weight="600">Why this encoding</text>
<text x="448" y="148" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">bx, by always in [0, 1]</text>
<text x="448" y="168" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">because the midpoint is inside the cell by definition.</text>
<text x="448" y="200" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">bh, bw may exceed 1</text>
<text x="448" y="220" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">because a car is often larger than one grid cell.</text>
<text x="448" y="252" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="600">One convolutional pass produces every cell at once.</text>
</g>
</svg>
