<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">VGG-16  ·  every CONV is 3×3 s=1 same, every POOL is 2×2 s=2  ·  ~138 M parameters</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">pooling halves the spatial size, each conv stack doubles the channels: 64→128→256→512</text>
