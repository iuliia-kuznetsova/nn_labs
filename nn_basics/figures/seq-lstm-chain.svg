<rect width="920" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The memory highway</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">with Γ_f ≈ 1 and Γ_u ≈ 0 the cell state crosses many steps untouched</text>
<line x1="70" y1="108" x2="866" y2="108" stroke="#ca8a04" stroke-width="4"/>
<text x="70" y="96" font-size="11" text-anchor="start" fill="#ca8a04" font-weight="600">c&lt;0&gt;</text>
<text x="862" y="96" font-size="11" text-anchor="end" fill="#ca8a04" font-weight="600">c&lt;3&gt; = c&lt;0&gt;</text>
<text x="470" y="96" font-size="10" text-anchor="middle" fill="#ca8a04" font-weight="600">the cell-state line: nothing on it but two element-wise products</text>
<rect x="172" y="152" width="156" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="250" y="174" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">LSTM  t = 1</text>
<rect x="184" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="199" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_f</text>
<rect x="218" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="233" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u</text>
<rect x="252" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="267" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_o</text>
<rect x="286" y="190" width="30" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="301" y="205" font-size="8.5" text-anchor="middle" fill="#111827" font-weight="normal">c-tilde</text>
<text x="250" y="240" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Γ_f ≈ 1,  Γ_u ≈ 0</text>
<line x1="250" y1="108" x2="250" y2="152" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="205" y="300" width="90" height="28" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="250" y="317.78" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">x&lt;1&gt;</text>
<line x1="250" y1="298" x2="250" y2="266" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="392" y="152" width="156" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="470" y="174" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">LSTM  t = 2</text>
<rect x="404" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="419" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_f</text>
<rect x="438" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="453" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u</text>
<rect x="472" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="487" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_o</text>
<rect x="506" y="190" width="30" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="521" y="205" font-size="8.5" text-anchor="middle" fill="#111827" font-weight="normal">c-tilde</text>
<text x="470" y="240" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Γ_f ≈ 1,  Γ_u ≈ 0</text>
<line x1="470" y1="108" x2="470" y2="152" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="425" y="300" width="90" height="28" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="470" y="317.78" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">x&lt;2&gt;</text>
<line x1="470" y1="298" x2="470" y2="266" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="612" y="152" width="156" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="690" y="174" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">LSTM  t = 3</text>
<rect x="624" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="639" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_f</text>
<rect x="658" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="673" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u</text>
<rect x="692" y="190" width="30" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="707" y="205" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_o</text>
<rect x="726" y="190" width="30" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="741" y="205" font-size="8.5" text-anchor="middle" fill="#111827" font-weight="normal">c-tilde</text>
<text x="690" y="240" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Γ_f ≈ 1,  Γ_u ≈ 0</text>
<line x1="690" y1="108" x2="690" y2="152" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="645" y="300" width="90" height="28" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="690" y="317.78" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">x&lt;3&gt;</text>
<line x1="690" y1="298" x2="690" y2="266" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<line x1="330" y1="228" x2="388" y2="228" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ah-ea580c)"/>
<text x="360" y="220" font-size="9.5" text-anchor="middle" fill="#ea580c" font-weight="600">a&lt;t&gt;</text>
<line x1="550" y1="228" x2="608" y2="228" stroke="#ea580c" stroke-width="1.8" marker-end="url(#ah-ea580c)"/>
<text x="580" y="220" font-size="9.5" text-anchor="middle" fill="#ea580c" font-weight="600">a&lt;t&gt;</text>
<text x="460" y="362" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">This is the same reason a GRU works, drawn as a picture: there is a path from c&lt;0&gt; to c&lt;3&gt; that the network can leave alone,</text>
<text x="460" y="378" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">so a value — and a gradient — can travel across many time steps without decaying.</text>
</g>
</svg>
