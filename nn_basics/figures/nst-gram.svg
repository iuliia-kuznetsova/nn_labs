<rect width="920" height="420" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The style (Gram) matrix</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">G^[ℓ] is nC × nC; entry (k, k′) is how much channels k and k′ fire together</text>
<rect x="48" y="78" width="420" height="150" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="258" y="110" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">G^[ℓ]_{k k′}   =   Σ_i Σ_j   a^[ℓ]_{i j k}  ·  a^[ℓ]_{i j k′}</text>
<text x="258" y="140" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">i = 1…nH    j = 1…nW    k, k′ = 1…nC</text>
<text x="258" y="168" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">unnormalized cross-covariance  ·  means are not subtracted</text>
<text x="258" y="190" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">large if both channels are active at the same positions</text>
<rect x="540" y="96" width="28" height="28" rx="0" fill="#aebaba" stroke="#9ca3af" stroke-width="0.8"/>
<text x="554" y="114" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">9</text>
