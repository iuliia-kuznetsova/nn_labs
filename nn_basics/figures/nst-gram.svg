<text x="610" y="84" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">G^[ℓ]   (nC × nC)</text>
<text x="610" y="254" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">channel k′  →</text>
<text x="524" y="166" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal" transform="rotate(-90 524 166)">channel k  ↓</text>
<rect x="48" y="278" width="824" height="96" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="460" y="306" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">J^[ℓ]_style(S, G)   =   (1 / (2 nH nW nC)²)   ‖ G^[ℓ](S)  −  G^[ℓ](G) ‖²_F</text>
<text x="460" y="332" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">Frobenius norm: sum of squared element-wise differences between the two Gram matrices</text>
<text x="460" y="354" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">The 1/(2 nH nW nC)² factor is a convention; β absorbs any constant anyway.</text>
