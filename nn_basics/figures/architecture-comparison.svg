<text x="450" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Parameter count across the case studies</text>
<text x="450" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">logarithmic scale — note that depth and parameter count are not the same thing</text>
