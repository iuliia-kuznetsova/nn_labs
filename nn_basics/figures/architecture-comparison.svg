<line x1="406.4" y1="70.0" x2="406.4" y2="262.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="406.402" y="280" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">1 M</text>
<line x1="587.9" y1="70.0" x2="587.9" y2="262.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="587.902" y="280" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">10 M</text>
<line x1="769.4" y1="70.0" x2="769.4" y2="262.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="769.402" y="280" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">100 M</text>
<text x="493" y="300" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">parameters (log scale)</text>
<text x="118" y="91" font-size="11.5" text-anchor="end" fill="#111827" font-weight="600">LeNet-5</text>
<text x="118" y="104" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">1998</text>
<rect x="130" y="76" width="54.6369" height="22" rx="2" fill="#9ca3af55" stroke="#9ca3af" stroke-width="1.2"/>
<text x="192.637" y="92" font-size="11" text-anchor="start" fill="#9ca3af" font-weight="600">60 K</text>
<text x="118" y="122" font-size="11.5" text-anchor="end" fill="#111827" font-weight="600">AlexNet</text>
<text x="118" y="135" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">2012</text>
<rect x="130" y="107" width="599.137" height="22" rx="2" fill="#2563eb55" stroke="#2563eb" stroke-width="1.2"/>
<text x="737.137" y="123" font-size="11" text-anchor="start" fill="#2563eb" font-weight="600">60 M</text>
<text x="118" y="153" font-size="11.5" text-anchor="end" fill="#111827" font-weight="600">VGG-16</text>
<text x="118" y="166" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">2014</text>
<rect x="130" y="138" width="664.791" height="22" rx="2" fill="#dc262655" stroke="#dc2626" stroke-width="1.2"/>
<text x="802.791" y="154" font-size="11" text-anchor="start" fill="#dc2626" font-weight="600">138 M</text>
<text x="118" y="184" font-size="11.5" text-anchor="end" fill="#111827" font-weight="600">GoogLeNet</text>
<text x="118" y="197" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">2014</text>
<rect x="130" y="169" width="429.788" height="22" rx="2" fill="#ca8a0455" stroke="#ca8a04" stroke-width="1.2"/>
<text x="567.788" y="185" font-size="11" text-anchor="start" fill="#ca8a04" font-weight="600">7 M</text>
<text x="118" y="215" font-size="11.5" text-anchor="end" fill="#111827" font-weight="600">ResNet-50</text>
<text x="118" y="228" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">2015</text>
<rect x="130" y="200" width="530.129" height="22" rx="2" fill="#7c3aed55" stroke="#7c3aed" stroke-width="1.2"/>
<text x="668.129" y="216" font-size="11" text-anchor="start" fill="#7c3aed" font-weight="600">25 M</text>
<text x="118" y="246" font-size="11.5" text-anchor="end" fill="#111827" font-weight="600">MobileNet v1</text>
<text x="118" y="259" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">2017</text>
<rect x="130" y="231" width="389.522" height="22" rx="2" fill="#16a34a55" stroke="#16a34a" stroke-width="1.2"/>
<text x="527.522" y="247" font-size="11" text-anchor="start" fill="#16a34a" font-weight="600">4 M</text>
<text x="450" y="316" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">GoogLeNet is deeper than VGG-16 with 20× fewer parameters, because 1×1 bottlenecks and global</text>
<text x="450" y="332" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">average pooling replace the huge fully connected layers. ResNet-50 is three times deeper</text>
<text x="450" y="348" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">than VGG-16 with a fifth of the parameters.</text>
<text x="450" y="366" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Bars are measured from the 30 K left edge of the axis, not from zero.</text>
