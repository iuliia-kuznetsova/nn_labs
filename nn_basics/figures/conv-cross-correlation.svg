<text x="323" y="132" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">flip left–right</text>
<line x1="467" y1="145" x2="527" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="497" y="132" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">flip top–bottom</text>
<text x="236" y="212" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">the filter as stored</text>
<text x="584" y="212" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">flipped on both axes</text>
<rect x="70" y="234" width="340" height="56" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="240" y="254" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">Deep learning: no flip</text>
<text x="240" y="274" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">uses the filter as stored — strictly, cross-correlation</text>
<rect x="430" y="234" width="320" height="56" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="590" y="254" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="600">Signal processing: flip first</text>
<text x="590" y="274" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">the flip is what makes convolution associative</text>
<text x="410" y="320" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">For learned weights the distinction does not matter: backprop simply learns the flipped filter instead.</text>
