<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="340" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Tune the high-impact knobs first</text>
<text x="340" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">learning rate dominates; Adam's β₂ almost never needs a search</text>
