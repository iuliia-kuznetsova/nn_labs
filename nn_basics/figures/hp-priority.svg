<text x="340" y="152" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">β₁, batch size, width</text>
<rect x="180" y="176" width="320" height="36" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="340" y="200" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">depth, schedule, λ</text>
