  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="360" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">3-D convolution on a volume</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">height, width, and depth are all spatial; channels are a fourth axis, just as in 2-D</text>
<polygon points="48,130 65.36,119.36 151.36,119.36 134,130" fill="#eceef1" stroke="#6b7280" stroke-width="1.15"/>
<polygon points="134,130 151.36,119.36 151.36,205.36 134,216" fill="#c3c6cc" stroke="#6b7280" stroke-width="1.15"/>
<polygon points="48,130 134,130 134,216 48,216" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="91" y="176.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">14³</text>
<text x="91" y="234" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">CT / video</text>
<text x="168" y="168" font-size="20" text-anchor="middle" fill="#6b7280" font-weight="normal">∗</text>
<polygon points="188,148 199.16,141.16 243.16,141.16 232,148" fill="#cef9dd" stroke="#16a34a" stroke-width="1.15"/>
<polygon points="232,148 243.16,141.16 243.16,185.16 232,192" fill="#a0d3b5" stroke="#16a34a" stroke-width="1.15"/>
<polygon points="188,148 232,148 232,192 188,192" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="210" y="173.24" font-size="9" text-anchor="middle" fill="#111827" font-weight="600">5³</text>
<text x="210" y="210" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3-D filter</text>
<text x="286" y="168" font-size="20" text-anchor="middle" fill="#6b7280" font-weight="normal">=</text>
<polygon points="308,140 321.64,131.64 383.64,131.64 370,140" fill="#fed9d9" stroke="#dc2626" stroke-width="1.15"/>
<polygon points="370,140 383.64,131.64 383.64,193.64 370,202" fill="#d8aeb0" stroke="#dc2626" stroke-width="1.15"/>
<polygon points="308,140 370,140 370,202 308,202" fill="#fecaca" stroke="#dc2626" stroke-width="1.3"/>
<text x="339" y="174.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">10³</text>
<text x="339" y="220" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one filter</text>
<line x1="408" y1="168" x2="448" y2="168" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah-9ca3af)"/>
<text x="560" y="100" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">16 filters of 5×5×5×1</text>
<text x="560" y="122" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">→  10×10×10×16</text>
<text x="560" y="154" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">next layer: 5×5×5×16, 32 filters</text>
<text x="560" y="176" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">→  6×6×6×32</text>
<rect x="448" y="210" width="424" height="88" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="660" y="236" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">Not the same as a 2-D RGB convolution.</text>
<text x="660" y="258" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">An image is 14×14×3: the 3 is channels, not depth.</text>
<text x="660" y="278" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">A CT scan is 14×14×14×1: the third 14 is a spatial axis.</text>
<text x="460" y="342" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Movies are 3-D too: two spatial axes plus time. The same output-size formula applies once per spatial axis, including depth.</text>
</g>
</svg>
