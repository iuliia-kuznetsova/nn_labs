<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="720" height="220" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="360" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Chain rule</text>
<text x="360" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">multiply the local derivatives along the composition</text>
<rect x="50" y="120" width="110" height="50" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="105" y="149" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">x</text>
<rect x="210" y="120" width="110" height="50" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="265" y="149" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">h(x)</text>
<rect x="370" y="120" width="110" height="50" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="425" y="149" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">g(h)</text>
<rect x="530" y="120" width="110" height="50" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="585" y="149" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">f(g(h))</text>
<line x1="168" y1="145" x2="202" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="328" y1="145" x2="362" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="488" y1="145" x2="522" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="360" y="190" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="600">df/dx = f' · g' · h'</text>
</g>
</svg>
