<rect x="186" y="231" width="30" height="30" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<rect x="300" y="141" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="330" y="141" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="360" y="141" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="300" y="171" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="330" y="171" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="360" y="171" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="300" y="201" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="330" y="201" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="360" y="201" width="30" height="30" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1"/>
<rect x="512" y="171" width="30" height="30" fill="#15803d" stroke="#9ca3af" stroke-width="1"/>
<line x1="228" y1="186" x2="288" y2="186" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="258" y="158" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3×3 conv</text>
<text x="258" y="171" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">s = 1</text>
<line x1="402" y1="186" x2="500" y2="186" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="451" y="158" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3×3 conv</text>
<text x="451" y="171" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">s = 1</text>
<text x="141" y="95" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">5×5 input region</text>
<text x="141" y="283" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">everything this unit can see</text>
<text x="345" y="125" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">after one conv</text>
<text x="527" y="155" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">one unit</text>
<rect x="600" y="108" width="290" height="156" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="608" y="98" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Same field, fewer weights</text>
<text x="620" y="138" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">stack</text>
<text x="748" y="138" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">field</text>
<text x="828" y="138" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">weights</text>
<line x1="616" y1="146" x2="874" y2="146" stroke="#9ca3af" stroke-width="1"/>
<text x="620" y="168" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">two 3×3</text>
<text x="748" y="168" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">5×5</text>
<text x="828" y="168" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="600">18</text>
<text x="620" y="190" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">one 5×5</text>
<text x="748" y="190" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">5×5</text>
<text x="828" y="190" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">25</text>
<text x="620" y="212" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">three 3×3</text>
<text x="748" y="212" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">7×7</text>
<text x="828" y="212" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="600">27</text>
<text x="620" y="234" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">one 7×7</text>
<text x="748" y="234" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">7×7</text>
<text x="828" y="234" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">49</text>
<text x="460" y="328" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Two stacked 3×3 convolutions cover the same 5×5 region as a single 5×5 convolution, with 18 weights instead of 25 and an extra non-linearity in between.</text>
<text x="460" y="344" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">This is why 3×3 filters dominate modern architectures. Striding and pooling enlarge the receptive field much faster than stacking alone.</text>
</g>
</svg>
