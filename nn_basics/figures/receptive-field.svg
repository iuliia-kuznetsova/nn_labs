<rect x="66" y="231" width="30" height="30" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<rect x="96" y="231" width="30" height="30" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<rect x="126" y="231" width="30" height="30" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
