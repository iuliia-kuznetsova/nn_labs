<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" height="372">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="372" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Receptive field: two 3×3 convolutions see a 5×5 region</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">which is why small filters stacked deep replaced large filters</text>
<polygon points="216,111 216,261 300,231 300,141" fill="#eafaf0" stroke="none" stroke-width="1"/>
<polygon points="390,141 390,231 512,201 512,171" fill="#eafaf0" stroke="none" stroke-width="1"/>
