<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 366" width="920" height="366">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="366" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">EfficientNet compound scaling</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">three knobs — resolution r, depth d, width w — scaled together at a searched ratio</text>
<rect x="75" y="78" width="34" height="34" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="92" y="128" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="77" y="142" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="77" y="162" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="77" y="182" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="77" y="202" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="92" y="300" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="600">baseline</text>
<text x="92" y="316" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">r, d, w = 1</text>
<rect x="259" y="78" width="34" height="34" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="276" y="128" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="247.5" y="142" width="57" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="247.5" y="162" width="57" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="247.5" y="182" width="57" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="247.5" y="202" width="57" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="276" y="300" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="600">width  w↑</text>
<text x="276" y="316" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">wider layers</text>
<line x1="184" y1="58" x2="184" y2="326" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="443" y="78" width="34" height="34" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="460" y="128" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="445" y="142" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="445" y="162" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="445" y="182" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="445" y="202" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="445" y="222" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="445" y="242" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="445" y="262" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="460" y="300" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="600">depth  d↑</text>
<text x="460" y="316" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">more layers</text>
<line x1="368" y1="58" x2="368" y2="326" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="617.65" y="59.3" width="52.7" height="52.7" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="644" y="128" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="629" y="142" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="629" y="162" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="629" y="182" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="629" y="202" width="30" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="644" y="300" font-size="11.5" text-anchor="middle" fill="#ca8a04" font-weight="600">resolution  r↑</text>
<text x="644" y="316" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">bigger input</text>
<line x1="552" y1="58" x2="552" y2="326" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="805.05" y="66.1" width="45.9" height="45.9" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="828" y="128" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="805.5" y="142" width="45" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="805.5" y="162" width="45" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="805.5" y="182" width="45" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="805.5" y="202" width="45" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="805.5" y="222" width="45" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="805.5" y="242" width="45" height="15" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="828" y="300" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">compound</text>
<text x="828" y="316" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">all three at once</text>
<line x1="736" y1="58" x2="736" y2="326" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4"/>
<text x="460" y="340" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Scaling one dimension alone saturates quickly: a higher-resolution input needs more depth to cover it and more width to resolve fine detail.</text>
<text x="460" y="358" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">EfficientNet's contribution is the ratio at which to scale all three for a given compute budget.</text>
</g>
</svg>
