<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 368" width="920" height="368">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="368" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Sliding-window detection</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">train on tightly cropped objects, then sweep windows of several sizes over the test image</text>
<rect x="36" y="72" width="250" height="220" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="44" y="62" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Train</text>
<rect x="86" y="108" width="150" height="110" rx="4" fill="#e8eef5" stroke="#6b7280" stroke-width="1.4"/>
<rect x="108" y="148" width="106" height="42" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.6"/>
<rect x="127.08" y="129.1" width="67.84" height="21.84" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.4"/>
<text x="161" y="238" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">closely cropped cars</text>
<text x="161" y="256" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">ConvNet  →  0 or 1</text>
<line x1="296" y1="182" x2="344" y2="182" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="356" y="72" width="528" height="220" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="364" y="62" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Test  —  sweep, then repeat with a larger window</text>
<rect x="380" y="108" width="280" height="160" rx="4" fill="#e8eef5" stroke="#9ca3af" stroke-width="1.3"/>
<rect x="380" y="207.2" width="280" height="60.8" rx="0" fill="#d6d3d1" stroke="none" stroke-width="0"/>
<line x1="380" y1="207.2" x2="660" y2="207.2" stroke="#c4c0bc" stroke-width="1"/>
<rect x="450" y="196" width="90" height="36" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.6"/>
<rect x="466.2" y="179.8" width="57.6" height="18.72" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.4"/>
<rect x="396" y="128" width="70" height="70" rx="2" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3"/>
<rect x="466" y="156" width="110" height="90" rx="2" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 3"/>
<rect x="428" y="144" width="160" height="118" rx="2" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="520" y="286" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">fine window     mid window     coarse window</text>
<text x="720" y="140" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">stride too large:</text>
<text x="720" y="160" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">misses the object</text>
<text x="720" y="192" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">stride too small:</text>
<text x="720" y="212" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">thousands of ConvNet</text>
<text x="720" y="228" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">passes  —  infeasibly slow</text>
<text x="460" y="346" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Before ConvNets a cheap linear classifier made this fine. With a ConvNet, each window is expensive, so you cannot afford to run them independently.</text>
</g>
</svg>
