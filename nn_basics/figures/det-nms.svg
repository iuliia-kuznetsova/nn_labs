<text x="460" y="338" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">1. Discard scores ≤ 0.6.   2. Output the highest remaining score.   3. Discard every leftover box with IoU ≥ 0.5 against it.   Repeat.</text>
