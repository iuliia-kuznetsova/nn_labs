<text x="518" y="258" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">channel 1</text>
<text x="700" y="100" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="normal">channel 192</text>
<text x="654" y="300" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the 192 values stacked through the depth of the volume</text>
<circle cx="790" cy="186" r="27" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
<text x="790" y="182" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">Σ w·x</text>
<text x="790" y="194" font-size="9.5" text-anchor="middle" fill="#111827" font-weight="normal">+ b, ReLU</text>
<text x="790" y="232" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">one filter</text>
<text x="790" y="245" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">= one neuron</text>
<line x1="820" y1="186" x2="862" y2="186" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="866" y="178" width="26" height="16" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="879" y="216" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">1 number</text>
<text x="690" y="322" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">32 filters ⇒ 32 numbers here ⇒ 32 output channels</text>
<text x="470" y="354" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Pooling reduces nH and nW but not nC.  A 1×1 convolution reduces nC but not nH and nW.</text>
