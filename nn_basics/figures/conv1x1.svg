<rect width="940" height="364" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="470" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The 1×1 convolution</text>
<text x="470" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a tiny fully connected network applied independently at every spatial position</text>
<text x="232" y="72" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">The whole volume</text>
<rect x="96" y="92" width="100" height="116" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="146" y="152" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">28×28×192</text>
<text x="146" y="226" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">input</text>
<text x="146" y="242" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">192 channels</text>
<line x1="210" y1="150" x2="300" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="255" y="116" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">32 filters of</text>
<text x="255" y="129" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">1×1×192</text>
<text x="255" y="174" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">+ ReLU</text>
<rect x="312" y="92" width="56" height="116" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="340" y="152" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×32</text>
<text x="340" y="226" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">output</text>
<text x="340" y="242" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">32 channels</text>
<rect x="92" y="164" width="108" height="10" fill="none" stroke="#dc2626" stroke-width="2"/>
<rect x="308" y="164" width="64" height="10" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="232" y="274" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">spatial size unchanged  ·  192 → 32 channels</text>
<text x="232" y="296" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">the red strip is one spatial position and all of its channels</text>
<line x1="452" y1="66" x2="452" y2="332" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
<text x="690" y="72" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">What happens at one spatial position</text>
