<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="270" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">A segmentation network has to grow the spatial size back</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">first half: spatial size shrinks and channels grow. second half: spatial size grows back. the grow operation is a transpose convolution.</text>
<rect x="30" y="92" width="13.4288" height="72" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="36.7144" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H×W×3</text>
<text x="36.7144" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="154.511" y="104.243" width="26.2346" height="47.5132" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="167.628" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H/2 × 64</text>
<text x="167.628" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">encoder</text>
<rect x="291.827" y="111.036" width="34.0914" height="33.9282" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="308.873" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H/4 × 128</text>
<text x="308.873" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal"></text>
<rect x="437" y="114.804" width="46" height="26.3915" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="460" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H/8 × 256</text>
<text x="460" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">bottleneck</text>
<rect x="594.082" y="111.036" width="34.0914" height="33.9282" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="611.127" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H/4 × 128</text>
<text x="611.127" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">decoder</text>
<rect x="739.255" y="104.243" width="26.2346" height="47.5132" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="752.372" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H/2 × 64</text>
<text x="752.372" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal"></text>
<rect x="876.571" y="92" width="13.4288" height="72" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="883.286" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">H×W×C</text>
<text x="883.286" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">per-pixel</text>
<line x1="47.4288" y1="128" x2="150.511" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="98.9697" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">conv + pool</text>
<text x="98.9697" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">nH ↓  nC ↑</text>
<line x1="184.745" y1="128" x2="287.827" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="236.286" y="62" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">conv + pool</text>
<line x1="329.918" y1="128" x2="433" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="381.459" y="62" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">conv + pool</text>
<line x1="487" y1="128" x2="590.082" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="538.541" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">transpose conv</text>
<text x="538.541" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">nH ↑  nC ↓</text>
<line x1="632.173" y1="128" x2="735.255" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="683.714" y="62" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">transpose conv</text>
<line x1="769.489" y1="128" x2="872.571" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="821.03" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">1×1 conv</text>
<text x="821.03" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">C = n_classes</text>
<rect x="30" y="219" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="46" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input</text>
<rect x="102.55" y="219" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="118.55" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">encoder CONV</text>
<rect x="220.67" y="219" width="11" height="11" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.1"/>
<text x="236.67" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">bottleneck</text>
<rect x="325.77" y="219" width="11" height="11" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.1"/>
<text x="341.77" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">decoder / transpose</text>
<rect x="489.46" y="219" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="505.46" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">per-pixel classes</text>
<text x="460" y="254" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Drop the classifier head of a ConvNet and replace it with an upsampling path. That is the essential structural change.</text>
</g>
</svg>
