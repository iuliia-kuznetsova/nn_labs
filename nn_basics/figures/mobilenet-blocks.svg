<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="330" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">MobileNet v1 and v2 blocks</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">v2 adds a residual connection and an expand-then-project shape</text>
<text x="30" y="70" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">MobileNet v1 block  ×13</text>
<rect x="24" y="80" width="400" height="100" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<rect x="56" y="112" width="128" height="46" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="120" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">depthwise</text>
<text x="120" y="144" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">3×3</text>
<line x1="188" y1="135" x2="224" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="228" y="112" width="128" height="46" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="292" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">pointwise</text>
<text x="292" y="144" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1</text>
<line x1="360" y1="135" x2="396" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="224" y="200" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">13 of these, then POOL → FC → softmax</text>
<text x="468" y="70" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">MobileNet v2 bottleneck block  ×17</text>
<rect x="452" y="80" width="444" height="100" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<rect x="474" y="112" width="106" height="46" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="527" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">expansion</text>
<text x="527" y="144" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1, ×6</text>
<rect x="592" y="112" width="106" height="46" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="645" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">depthwise</text>
<text x="645" y="144" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">3×3, same</text>
<rect x="710" y="112" width="106" height="46" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="763" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">projection</text>
<text x="763" y="144" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1</text>
<line x1="580" y1="135" x2="588" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="698" y1="135" x2="706" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<circle cx="838" cy="135" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="838" y="140" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="600">+</text>
<line x1="816" y1="135" x2="824" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M 466,112 C 466,86 838,86 838,121" fill="none" stroke="#dc2626" stroke-width="1.7" marker-end="url(#ah)"/>
<text x="652" y="106" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="600">residual connection</text>
<text x="674" y="200" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">17 of these, then POOL → FC → softmax</text>
<text x="460" y="240" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">shape trace through a v2 block</text>
<rect x="114" y="256" width="132" height="32" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="180" y="277" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">n×n×3</text>
<text x="180" y="302" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<line x1="250" y1="272" x2="290" y2="272" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="304" y="256" width="132" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="370" y="277" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">n×n×18</text>
<text x="370" y="302" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">after expansion</text>
<line x1="440" y1="272" x2="480" y2="272" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="494" y="256" width="132" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="560" y="277" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">n×n×18</text>
<text x="560" y="302" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">after depthwise</text>
<line x1="630" y1="272" x2="670" y2="272" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="684" y="256" width="132" height="32" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="750" y="277" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">n×n×3</text>
<text x="750" y="302" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">after projection</text>
<text x="460" y="322" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Expansion gives the block a richer internal representation; projection keeps the activations passed between blocks small, which is what constrains memory on an edge device.</text>
</g>
</svg>
