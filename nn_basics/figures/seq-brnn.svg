<rect x="746" y="94" width="108" height="30" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="800" y="112.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;4&gt;</text>
