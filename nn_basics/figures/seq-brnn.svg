<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Bidirectional RNN</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a second, backward recurrent layer, so a prediction can use the whole sentence</text>
