<text x="275" y="174" font-size="9.5" text-anchor="middle" fill="#ea580c" font-weight="600">forward in time</text>
<text x="485" y="274" font-size="9.5" text-anchor="middle" fill="#2563eb" font-weight="600">backward in time</text>
<rect x="530" y="88" width="120" height="42" rx="6" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="590" y="74" font-size="9.5" text-anchor="middle" fill="#dc2626" font-weight="600">uses He said Teddy  and  Roosevelt</text>
<line x1="40" y1="364" x2="880" y2="364" stroke="#9ca3af" stroke-width="1"/>
<rect x="48" y="382" width="400" height="82" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="248" y="412" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;t&gt; = g(W_y [a-forward&lt;t&gt;, a-backward&lt;t&gt;] + b_y)</text>
<text x="248" y="440" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the graph is acyclic: run both passes, then predict</text>
<rect x="472" y="382" width="400" height="82" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="672" y="408" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">The cost</text>
<text x="672" y="428" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">you need the entire sequence before predicting anywhere —</text>
<text x="672" y="443" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">fine for a full sentence, awkward for live speech</text>
<text x="460" y="488" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The blocks can be plain RNN, GRU, or LSTM. A bidirectional LSTM is a reasonable first thing to try on an NLP task where you have the whole sentence.</text>
</g>
