<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="720" height="260" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="360" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Split percentages depend on dataset size</text>
<text x="360" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">dev and test need enough examples, not a fixed 20%</text>
<text x="40" y="82" font-size="12" text-anchor="start" fill="#111827" font-weight="600">~10 k examples</text>
<rect x="40" y="90" width="384" height="36" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="232" y="114" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">train 60%</text>
<rect x="424" y="90" width="128" height="36" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="488" y="114" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">dev 20%</text>
<rect x="552" y="90" width="128" height="36" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="616" y="114" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">test 20%</text>
<text x="40" y="162" font-size="12" text-anchor="start" fill="#111827" font-weight="600">~1 M examples</text>
<rect x="40" y="170" width="627.2" height="36" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="353.6" y="194" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">train 98%</text>
<rect x="667.2" y="170" width="36" height="36" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="685.2" y="194" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">dev 1%</text>
<rect x="703.2" y="170" width="36" height="36" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="721.2" y="194" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">test 1%</text>
</g>
</svg>
