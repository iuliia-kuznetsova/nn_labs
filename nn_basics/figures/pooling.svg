<text x="434" y="94" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">Max pooling</text>
<text x="434" y="196" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">keeps the strongest response in each region</text>
<line x1="238" y1="220" x2="378" y2="290" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="400" y="256" width="34" height="34" fill="#fee2e2" stroke="#9ca3af" stroke-width="1"/>
<text x="417" y="277.5" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="normal">3.75</text>
<rect x="434" y="256" width="34" height="34" fill="#fef3c7" stroke="#9ca3af" stroke-width="1"/>
<text x="451" y="277.5" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="normal">1.25</text>
<rect x="400" y="290" width="34" height="34" fill="#dcfce7" stroke="#9ca3af" stroke-width="1"/>
<text x="417" y="311.5" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="normal">3.75</text>
<rect x="434" y="290" width="34" height="34" fill="#dbeafe" stroke="#9ca3af" stroke-width="1"/>
<text x="451" y="311.5" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="normal">2.00</text>
<rect x="400" y="256" width="34" height="34" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<rect x="434" y="256" width="34" height="34" fill="none" stroke="#ca8a04" stroke-width="2.2"/>
<rect x="400" y="290" width="34" height="34" fill="none" stroke="#16a34a" stroke-width="2.2"/>
<rect x="434" y="290" width="34" height="34" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<text x="434" y="242" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">Average pooling</text>
<text x="434" y="344" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">keeps the mean of each region</text>
<text x="300" y="168" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">max</text>
<text x="300" y="268" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">mean</text>
<rect x="552" y="92" width="320" height="108" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="560" y="82" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Hyperparameters</text>
<text x="570" y="122" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">f  — region size (2, sometimes 3)</text>
<text x="570" y="144" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">s  — stride (usually 2)</text>
<text x="570" y="166" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">max or average;  p = 0 almost always</text>
<text x="570" y="188" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">f = s = 2 roughly halves height and width</text>
<rect x="552" y="236" width="320" height="124" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="560" y="226" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Parameters: none</text>
<text x="570" y="266" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">Nothing here is learned by gradient descent.</text>
<text x="570" y="292" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Backprop still routes gradients through it:</text>
<text x="570" y="312" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">max sends the gradient to the argmax only,</text>
<text x="570" y="330" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">average spreads it evenly over the region.</text>
<text x="570" y="352" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">Applied per channel, so nC is unchanged.</text>
<text x="450" y="386" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Max pooling reports whether a feature appeared in the region, discarding exactly where it appeared.</text>
