<rect width="880" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="440" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Landmark detection</text>
<text x="440" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the same idea: output a list of (x, y) coordinates instead of a box</text>
<rect x="90" y="80" width="200" height="200" rx="8" fill="#f5f0eb" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="190" cy="176" r="78" fill="#fde8d0" stroke="#d6b48a" stroke-width="1.6"/>
<circle cx="160" cy="158" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="160" y="161.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">1</text>
<circle cx="182" cy="158" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="182" y="161.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">2</text>
<circle cx="198" cy="158" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="198" y="161.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">3</text>
<circle cx="220" cy="158" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="220" y="161.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">4</text>
<circle cx="190" cy="188" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="190" y="191.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">5</text>
<circle cx="168" cy="212" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="168" y="215.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">6</text>
<circle cx="190" cy="218" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="190" y="221.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">7</text>
<circle cx="212" cy="212" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
<text x="212" y="215.5" font-size="8" text-anchor="middle" fill="#ffffff" font-weight="600">8</text>
<text x="190" y="302" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">64 landmarks  →  128 coordinates  +  1 face bit  =  129 outputs</text>
<rect x="360" y="80" width="480" height="196" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="380" y="108" font-size="13" text-anchor="start" fill="#111827" font-weight="600">N landmarks  ⇒  2N coordinate outputs</text>
<text x="380" y="138" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">Landmark 1 must be the same anatomical point in every image.</text>
<text x="380" y="160" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">If identity drifts, the network has nothing consistent to learn.</text>
<line x1="380" y1="178" x2="820" y2="178" stroke="#9ca3af" stroke-width="1"/>
<text x="380" y="202" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="600">Face</text>
<text x="490" y="202" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">eye corners, mouth, jaw</text>
<text x="380" y="224" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="600">Pose</text>
<text x="490" y="224" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">shoulders, elbows, wrists</text>
<text x="380" y="246" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="600">AR filters</text>
<text x="490" y="246" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">snap a crown to landmark 12</text>
<text x="440" y="322" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Having a network output a set of real numbers, as a regression, is a reusable idea — boxes, landmarks, and keypoints are the same mechanism.</text>
</g>
</svg>
