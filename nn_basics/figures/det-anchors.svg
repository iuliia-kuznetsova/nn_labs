<rect width="920" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Anchor boxes: two objects, one cell</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">each predefined shape gets its own 8-number slot in the cell's output</text>
<rect x="56" y="100" width="200" height="200" rx="4" fill="#e8eef5" stroke="#9ca3af" stroke-width="1.3"/>
<rect x="56" y="224" width="200" height="76" rx="0" fill="#d6d3d1" stroke="none" stroke-width="0"/>
<line x1="56" y1="224" x2="256" y2="224" stroke="#c4c0bc" stroke-width="1"/>
<rect x="56" y="100" width="200" height="200" rx="0" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/>
<text x="156" y="88" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="600">one grid cell</text>
<circle cx="126" cy="140.5" r="16.5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
<rect x="105" y="158.65" width="42" height="63" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
<rect x="108" y="221.65" width="15" height="33" rx="2" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
<rect x="129" y="221.65" width="15" height="33" rx="2" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
<rect x="86" y="218" width="150" height="48" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.6"/>
<rect x="113" y="196.4" width="96" height="24.96" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.4"/>
<circle cx="156" cy="200" r="4.2" fill="#ca8a04" stroke="#ffffff" stroke-width="1.4"/>
<text x="166" y="192" font-size="10.5" text-anchor="start" fill="#ca8a04" font-weight="600">shared midpoint</text>
<text x="340" y="92" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">anchor 1</text>
<rect x="300" y="104" width="44" height="120" rx="3" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="322" y="242" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">tall, thin</text>
<text x="430" y="92" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="600">anchor 2</text>
<rect x="380" y="148" width="120" height="52" rx="3" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="440" y="242" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">wide, flat</text>
<line x1="322" y1="256" x2="322" y2="286" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="440" y1="256" x2="440" y2="286" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="322" y="304" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">pedestrian</text>
<text x="440" y="304" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="600">car</text>
<text x="380" y="326" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">highest IoU with the object's shape</text>
<rect x="560" y="86" width="330" height="250" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="576" y="114" font-size="13" text-anchor="start" fill="#111827" font-weight="600">y per cell, 2 anchors</text>
<text x="576" y="142" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">anchor 1   ‖   anchor 2</text>
<text x="576" y="164" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">8 numbers           8 numbers</text>
<line x1="576" y1="180" x2="874" y2="180" stroke="#9ca3af" stroke-width="1"/>
<text x="576" y="206" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">3×3, no anchors     →  3×3×8</text>
<text x="576" y="228" font-size="12" text-anchor="start" fill="#111827" font-weight="600">3×3, 2 anchors      →  3×3×16</text>
<text x="576" y="250" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">19×19, 5, 3 classes →  19×19×40</text>
<text x="576" y="284" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">Object → (cell of midpoint,</text>
<text x="576" y="304" font-size="11.5" text-anchor="start" fill="#111827" font-weight="normal">          anchor of best IoU)</text>
<text x="460" y="384" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The real payoff is specialization: some units learn tall skinny things, others wide flat things. Two objects in one cell is rare on a 19×19 grid.</text>
</g>
</svg>
