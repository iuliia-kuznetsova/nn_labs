<text x="460" y="444" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Three recurrent layers is already a lot — the temporal extent makes these expensive, so you do not see 100-layer RNNs.</text>
<text x="460" y="460" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The same parameters W_a[l], b_a[l] are shared across time within a layer, and each layer has its own set. Blocks can be GRU or LSTM, and each layer can be bidirectional.</text>
