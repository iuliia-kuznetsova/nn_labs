<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="640" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="320" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Fix bias, then variance</text>
<text x="320" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">in the big-data regime the two knobs barely fight</text>
<rect x="220" y="70" width="280" height="48" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="360" y="98" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">train the model</text>
<rect x="220" y="140" width="280" height="48" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="360" y="168" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">high train error?  →  bigger net</text>
<rect x="220" y="210" width="280" height="48" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="360" y="238" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">high dev gap?  →  more data / L2 / dropout</text>
<rect x="220" y="280" width="280" height="48" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="360" y="308" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">low bias and low variance</text>
<line x1="360" y1="120" x2="360" y2="136" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="360" y1="190" x2="360" y2="206" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="360" y1="260" x2="360" y2="276" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
</g>
</svg>
