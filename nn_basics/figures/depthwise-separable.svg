<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-fecaca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#fecaca"/>
  </marker>
  <marker id="ah-bbf7d0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#bbf7d0"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-22c55e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Depthwise separable convolution</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">6×6×3 → 4×4×5 both ways: one normal convolution, or a depthwise step followed by a pointwise step</text>
<rect x="24" y="64" width="400" height="150" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
<text x="40" y="86" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Normal convolution</text>
<rect x="66" y="104" width="56" height="56" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<rect x="59" y="111" width="56" height="56" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<rect x="52" y="118" width="56" height="56" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<text x="88" y="202" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">6×6×3</text>
<line x1="140" y1="140" x2="196" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="168" y="118" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">5 filters</text>
<text x="168" y="131" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3×3×3</text>
<rect x="236" y="98" width="40" height="40" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="230" y="104" width="40" height="40" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="224" y="110" width="40" height="40" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="218" y="116" width="40" height="40" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<rect x="212" y="122" width="40" height="40" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="240" y="202" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">4×4×5</text>
<rect x="292" y="122" width="116" height="56" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<text x="350" y="142" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">3·3·3 × 4·4 × 5</text>
<text x="350" y="160" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">= 2,160 mults</text>
<rect x="452" y="64" width="444" height="150" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<text x="468" y="86" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Step 1 — depthwise: one f×f filter per channel, applied to that channel only</text>
<rect x="474" y="108" width="38" height="23" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<line x1="516" y1="119" x2="552" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="556" y="111" width="18" height="18" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<line x1="578" y1="119" x2="614" y2="119" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="618" y="111" width="24" height="18" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<rect x="474" y="137" width="38" height="23" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<line x1="516" y1="148" x2="552" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="556" y="140" width="18" height="18" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<line x1="578" y1="148" x2="614" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="618" y="140" width="24" height="18" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<rect x="474" y="166" width="38" height="23" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
<line x1="516" y1="177" x2="552" y2="177" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="556" y="169" width="18" height="18" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<line x1="578" y1="177" x2="614" y2="177" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="618" y="169" width="24" height="18" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<text x="493" y="204" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">6×6×3</text>
<text x="565" y="204" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">3 filters 3×3</text>
<text x="630" y="204" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">4×4×3</text>
<rect x="676" y="116" width="112" height="50" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="732" y="136" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">3·3 × 4·4 × 3</text>
<text x="732" y="154" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">= 432 mults</text>
<text x="838" y="136" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">channel count</text>
<text x="838" y="151" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">unchanged</text>
<rect x="452" y="228" width="444" height="128" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<text x="468" y="250" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Step 2 — pointwise: a 1×1×nc convolution that mixes channels</text>
<rect x="496" y="278" width="34" height="34" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<rect x="491" y="283" width="34" height="34" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<rect x="486" y="288" width="34" height="34" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<text x="508" y="344" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">4×4×3</text>
<line x1="540" y1="300" x2="580" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="560" y="280" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">5 filters</text>
<text x="560" y="293" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">1×1×3</text>
<rect x="616" y="268" width="30" height="30" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<rect x="611" y="273" width="30" height="30" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<rect x="606" y="278" width="30" height="30" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<rect x="601" y="283" width="30" height="30" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<rect x="596" y="288" width="30" height="30" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="618" y="344" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">4×4×5</text>
<rect x="670" y="274" width="116" height="52" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="728" y="294" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1·1·3 × 4·4 × 5</text>
<text x="728" y="312" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">= 240 mults</text>
<text x="842" y="292" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">432 + 240</text>
<text x="842" y="308" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">= 672</text>
<rect x="24" y="228" width="400" height="128" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="224" y="254" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">672 / 2,160 ≈ 0.31</text>
<text x="224" y="288" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">cost ratio  =  1/nc′  +  1/f²</text>
<text x="224" y="310" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">1/5 + 1/9 = 0.311   ✓</text>
<text x="224" y="334" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">with nc′ = 512:  1/512 + 1/9 ≈ 1/9, so roughly 10× cheaper</text>
<text x="460" y="388" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">The depthwise step never changes the channel count; the pointwise step is what changes it.</text>
</g>
</svg>
