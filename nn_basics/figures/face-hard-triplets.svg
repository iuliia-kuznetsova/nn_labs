<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-fdba74" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#fdba74"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Easy triplets teach nothing; hard triplets do the work</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">random negatives are usually already far away, so the loss is already zero</text>
<rect x="36" y="68" width="420" height="210" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="246" y="92" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">Easy triplet  (random N)</text>
<line x1="80" y1="170" x2="420" y2="170" stroke="#9ca3af" stroke-width="1.3"/>
<circle cx="110" cy="170" r="7" fill="#16a34a" stroke="#16a34a" stroke-width="1.4"/>
<text x="110" y="194" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">A</text>
<circle cx="160" cy="170" r="7" fill="#16a34a" stroke="#16a34a" stroke-width="1.4"/>
<text x="160" y="194" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">P</text>
<circle cx="390" cy="170" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="1.4"/>
<text x="390" y="194" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">N</text>
<text x="246" y="214" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">d(A, N) ≫ d(A, P) + α</text>
<text x="246" y="236" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">loss already 0  ·  gradient is 0</text>
<text x="246" y="256" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the network learns nothing from this triplet</text>
<rect x="484" y="68" width="400" height="210" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="684" y="92" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">Hard triplet</text>
<line x1="528" y1="170" x2="850" y2="170" stroke="#9ca3af" stroke-width="1.3"/>
<circle cx="560" cy="170" r="7" fill="#16a34a" stroke="#16a34a" stroke-width="1.4"/>
<text x="560" y="194" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">A</text>
<circle cx="640" cy="170" r="7" fill="#16a34a" stroke="#16a34a" stroke-width="1.4"/>
<text x="640" y="194" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">P</text>
<circle cx="700" cy="170" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="1.4"/>
<text x="700" y="194" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">N</text>
<text x="684" y="214" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">d(A, P) ≈ d(A, N)</text>
<text x="684" y="236" font-size="12" text-anchor="middle" fill="#ea580c" font-weight="600">loss &gt; 0  ·  gradient has work to do</text>
<text x="684" y="256" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">push N out or pull P in until the margin holds</text>
<text x="460" y="322" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">FaceNet (Schroff, Kalenichenko, Philbin): mine the triplets that currently violate the margin.</text>
</g>
</svg>
