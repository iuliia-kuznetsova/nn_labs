  </marker>
  <marker id="ah-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="506" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Why a basic RNN forgets</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the gradient from a late step decays exponentially on its way back to an early one</text>
<rect x="65" y="150.117" width="32" height="3.88301" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="159.75" y="149.395" width="32" height="4.60548" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="254.5" y="148.081" width="32" height="5.91905" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="349.25" y="145.693" width="32" height="8.30736" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="444" y="141.35" width="32" height="12.6498" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="538.75" y="133.455" width="32" height="20.545" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="633.5" y="119.1" width="32" height="34.9" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<rect x="728.25" y="93" width="32" height="61" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="40" y="74" font-size="10.5" text-anchor="start" fill="#dc2626" font-weight="600">‖ gradient reaching step t from the loss at “was” ‖</text>
<text x="744.25" y="84" font-size="9.5" text-anchor="middle" fill="#dc2626" font-weight="normal">loss here</text>
<rect x="40" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="81" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">The</text>
<rect x="134.75" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="175.75" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">cat</text>
<line x1="123" y1="183" x2="131.75" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="229.5" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="270.5" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">,</text>
<line x1="217.75" y1="183" x2="226.5" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="324.25" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="365.25" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">which</text>
<line x1="312.5" y1="183" x2="321.25" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="419" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="460" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">already</text>
<line x1="407.25" y1="183" x2="416" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="513.75" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="554.75" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">ate</text>
<line x1="502" y1="183" x2="510.75" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="608.5" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="649.5" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">…</text>
<line x1="596.75" y1="183" x2="605.5" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="703.25" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="744.25" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">was</text>
<line x1="691.5" y1="183" x2="700.25" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<rect x="798" y="166" width="82" height="34" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="839" y="186.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">full</text>
<line x1="786.25" y1="183" x2="795" y2="183" stroke="#9ca3af" stroke-width="1.1" marker-end="url(#ah-9ca3af)"/>
<path d="M 175.75 216 C 365.25 268, 649.5 268, 744.25 218" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ah-16a34a)"/>
<text x="460" y="284" font-size="10.5" text-anchor="middle" fill="#16a34a" font-weight="600">singular subject decides  was, not were  — and the gap can be arbitrarily long</text>
<line x1="40" y1="306" x2="880" y2="306" stroke="#9ca3af" stroke-width="1"/>
<rect x="40" y="330" width="500" height="132" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="48" y="320" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Vanishing gradients: local influence</text>
<text x="290" y="360" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">y-hat&lt;t&gt; ends up mostly determined by inputs near t.</text>
<text x="290" y="378" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">An RNN over 1,000 steps is a 1,000-layer network, so the</text>
<text x="290" y="396" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">error at a late step barely reaches the early computations.</text>
<text x="290" y="414" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Fix: gated units (GRU, LSTM) — not clipping.</text>
<rect x="568" y="330" width="312" height="132" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="576" y="320" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Exploding gradients: clip</text>
<circle cx="630" cy="414" r="34" fill="none" stroke="#2563eb" stroke-width="1.4"/>
<line x1="630" y1="414" x2="856" y2="352" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah-dc2626)"/>
<line x1="630" y1="414" x2="663" y2="405" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ah-2563eb)"/>
<text x="636" y="460" font-size="9" text-anchor="start" fill="#2563eb" font-weight="normal">threshold</text>
<text x="700" y="428" font-size="9.5" text-anchor="start" fill="#2563eb" font-weight="600">rescale the gradient</text>
<text x="700" y="442" font-size="9.5" text-anchor="start" fill="#2563eb" font-weight="600">back onto the threshold</text>
<text x="830" y="344" font-size="9.5" text-anchor="middle" fill="#dc2626" font-weight="600">NaNs</text>
<text x="460" y="486" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Exploding gradients are easy to spot and easy to fix. Vanishing gradients are the real problem, and they are what gated units were invented for.</text>
</g>
</svg>
