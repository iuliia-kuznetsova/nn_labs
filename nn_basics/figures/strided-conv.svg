<text x="477" y="146" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">3×3 output</text>
<text x="477" y="284" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">one value per window position</text>
<rect x="640" y="92" width="250" height="128" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="648" y="82" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Output size</text>
<text x="765" y="126" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">⌊ (n + 2p − f) / s ⌋ + 1</text>
<line x1="660" y1="142" x2="870" y2="142" stroke="#9ca3af" stroke-width="1"/>
<text x="765" y="166" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal">⌊ (7 + 0 − 3) / 2 ⌋ + 1 = 3</text>
<text x="765" y="194" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">with s = 1 the same filter</text>
<text x="765" y="209" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">would give a 5×5 output</text>
<text x="460" y="396" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The floor matters: a window is only computed when it fits entirely inside the input plus padding, and a window hanging off the edge is skipped.</text>
<text x="460" y="412" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Stride 2 roughly halves the height and width, which is one of the two standard ways to downsample — pooling is the other.</text>
</g>
