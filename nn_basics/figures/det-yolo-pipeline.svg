<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="300" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The complete YOLO test-time pipeline</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the network over-predicts; thresholding and per-class NMS leave one box per object</text>
<rect x="40" y="100" width="150" height="90" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="115" y="141" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">100×100×3</text>
<text x="115" y="157" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">image</text>
<rect x="230" y="90" width="160" height="110" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="310" y="141" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">ConvNet</text>
<text x="310" y="157" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">3×3×2×8</text>
<rect x="430" y="100" width="150" height="90" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="505" y="141" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">threshold</text>
<text x="505" y="157" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">drop pc ≤ 0.6</text>
<rect x="620" y="100" width="150" height="90" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="695" y="141" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">NMS</text>
<text x="695" y="157" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">once per class</text>
<rect x="810" y="100" width="70" height="90" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="845" y="149" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">boxes</text>
<line x1="194" y1="145" x2="226" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="394" y1="145" x2="426" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="584" y1="145" x2="616" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="774" y1="145" x2="806" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="310" y="220" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">S×S×B×(5+C)</text>
<text x="505" y="220" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">most boxes die here</text>
<text x="695" y="220" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">pedestrians, cars, … separately</text>
<text x="460" y="282" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Raw output for 19×19 with 5 anchors: 1,805 boxes. Almost all have near-zero pc. Threshold first, then NMS — not the other way around.</text>
</g>
</svg>
