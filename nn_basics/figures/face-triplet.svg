<rect width="920" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The triplet: Anchor, Positive, Negative</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">pull the positive toward the anchor, push the negative away, and keep a margin α between them</text>
<rect x="100" y="72" width="160" height="130" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="180" y="92" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">Anchor  A</text>
<circle cx="180" cy="138" r="26" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.7"/>
<circle cx="171.68" cy="133.32" r="2.86" fill="#2563eb" stroke="#2563eb" stroke-width="0.4"/>
<circle cx="188.32" cy="133.32" r="2.86" fill="#2563eb" stroke="#2563eb" stroke-width="0.4"/>
<path d="M 171.68,143.72 Q 180,151 188.32,143.72" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="180" y="186" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">Danielle</text>
<rect x="380" y="72" width="160" height="130" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="460" y="92" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">Positive  P</text>
<circle cx="460" cy="138" r="26" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.7"/>
<circle cx="451.68" cy="133.32" r="2.86" fill="#2563eb" stroke="#2563eb" stroke-width="0.4"/>
<circle cx="468.32" cy="133.32" r="2.86" fill="#2563eb" stroke="#2563eb" stroke-width="0.4"/>
<path d="M 451.68,143.72 Q 460,151 468.32,143.72" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text x="460" y="186" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">Danielle, different photo</text>
<rect x="660" y="72" width="160" height="130" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="740" y="92" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">Negative  N</text>
<circle cx="740" cy="138" r="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.7"/>
<circle cx="731.68" cy="133.32" r="2.86" fill="#16a34a" stroke="#16a34a" stroke-width="0.4"/>
<circle cx="748.32" cy="133.32" r="2.86" fill="#16a34a" stroke="#16a34a" stroke-width="0.4"/>
<path d="M 731.68,143.72 Q 740,151 748.32,143.72" fill="none" stroke="#16a34a" stroke-width="1.6"/>
<text x="740" y="186" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">Kian</text>
<line x1="264" y1="138" x2="376" y2="138" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ah-16a34a)"/>
<text x="320" y="126" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="600">d(A, P)  small</text>
<line x1="544" y1="138" x2="656" y2="138" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah-dc2626)"/>
<text x="600" y="126" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">d(A, N)  large</text>
<text x="70" y="240" font-size="11" text-anchor="start" fill="#111827" font-weight="600">want</text>
<line x1="180" y1="248" x2="740" y2="248" stroke="#9ca3af" stroke-width="1.4"/>
<circle cx="180" cy="248" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
<text x="180" y="270" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">A</text>
<circle cx="300" cy="248" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
<text x="300" y="270" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">P</text>
<circle cx="740" cy="248" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.2"/>
<text x="740" y="270" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">N</text>
<line x1="180" y1="234" x2="300" y2="234" stroke="#16a34a" stroke-width="1.6"/>
<text x="240" y="222" font-size="10.5" text-anchor="middle" fill="#16a34a" font-weight="600">d(A, P)</text>
<line x1="300" y1="234" x2="420" y2="234" stroke="#ca8a04" stroke-width="1.6"/>
<text x="360" y="222" font-size="10.5" text-anchor="middle" fill="#ca8a04" font-weight="600">α  margin</text>
<line x1="180" y1="288" x2="740" y2="288" stroke="#dc2626" stroke-width="1.4"/>
<text x="460" y="304" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">d(A, N)  ≥  d(A, P) + α</text>
<rect x="70" y="324" width="780" height="40" rx="6" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.4"/>
<text x="460" y="348" font-size="11.5" text-anchor="middle" fill="#ca8a04" font-weight="600">Without α the network can cheat: output the zero vector, or the same vector for every face.</text>
<text x="460" y="384" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Example: if d(A, P) = 0.5 and α = 0.2, then d(A, N) = 0.51 is not good enough — it must be at least 0.7.</text>
</g>
</svg>
