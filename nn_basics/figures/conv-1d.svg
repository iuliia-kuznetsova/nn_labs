<rect width="920" height="340" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">1-D convolution on a time series</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the same 5-tap filter slides along an EKG; 14 ∗ 5 = 10, just as 14×14 ∗ 5×5 = 10×10</text>
<text x="40" y="78" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">2-D (images)</text>
<rect x="40" y="96" width="70" height="70" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="75" y="134" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">14×14</text>
<text x="130" y="134" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="normal">∗</text>
<rect x="150" y="110" width="42" height="42" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="171" y="134" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">5×5</text>
<text x="210" y="134" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="normal">=</text>
<rect x="230" y="104" width="54" height="54" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="257" y="134" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">10×10</text>
<text x="400" y="134" font-size="12" text-anchor="start" fill="#111827" font-weight="600">16 filters  →  10×10×16</text>
<line x1="40" y1="186" x2="880" y2="186" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="214" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">1-D (EKG, audio, other sequences)</text>
<rect x="40" y="232" width="224" height="36" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<line x1="56" y1="232" x2="56" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="72" y1="232" x2="72" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="88" y1="232" x2="88" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
