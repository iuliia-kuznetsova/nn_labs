<line x1="120" y1="232" x2="120" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="136" y1="232" x2="136" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="152" y1="232" x2="152" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="168" y1="232" x2="168" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="184" y1="232" x2="184" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="200" y1="232" x2="200" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="216" y1="232" x2="216" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="232" y1="232" x2="232" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="248" y1="232" x2="248" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<text x="152" y="254" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">14</text>
<text x="152" y="284" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">length 14</text>
<text x="152" y="300" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one lead</text>
<text x="280" y="254" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="normal">∗</text>
<rect x="304" y="232" width="80" height="36" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<line x1="320" y1="232" x2="320" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="336" y1="232" x2="336" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="352" y1="232" x2="352" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="368" y1="232" x2="368" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<text x="344" y="254" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">5</text>
<text x="344" y="284" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">length 5</text>
<text x="404" y="254" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="normal">=</text>
<rect x="428" y="232" width="160" height="36" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<line x1="444" y1="232" x2="444" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="460" y1="232" x2="460" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="476" y1="232" x2="476" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="492" y1="232" x2="492" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="508" y1="232" x2="508" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="524" y1="232" x2="524" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="540" y1="232" x2="540" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="556" y1="232" x2="556" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<line x1="572" y1="232" x2="572" y2="268" stroke="#9ca3af" stroke-width="0.7"/>
<text x="508" y="254" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">10</text>
<text x="508" y="284" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">length 10</text>
<text x="605" y="248" font-size="12" text-anchor="start" fill="#111827" font-weight="600">16 filters → 10×16</text>
<text x="605" y="268" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">then ∗ 5, 32 filters → 6×32</text>
<text x="460" y="322" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Same idea as 2-D: one feature detector, reused at every position. RNNs are the usual tool for sequences; 1-D ConvNets are a competitive alternative.</text>
</g>
