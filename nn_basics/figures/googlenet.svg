<rect x="403.22" y="253" width="11" height="11" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.1"/>
<text x="419.22" y="262" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">FC</text>
<rect x="456.24" y="253" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="472.24" y="262" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">softmax</text>
<text x="460" y="292" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The side branches force intermediate features to be predictive of the label and act as a regularizer.</text>
<text x="460" y="310" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Named GoogLeNet as an homage to LeNet; “Inception” comes from the “we need to go deeper” meme cited in the paper.</text>
