<rect width="920" height="300" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The cost of a generated image G</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">content says stay like C; style says look like S; α and β trade the two off</text>
<rect x="70" y="90" width="200" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="170" y="128" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="600">J_content(C, G)</text>
<text x="170" y="152" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">how similar is the</text>
<text x="170" y="170" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">content of G to C?</text>
<text x="300" y="154" font-size="22" text-anchor="middle" fill="#6b7280" font-weight="600">+</text>
<rect x="340" y="90" width="200" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="440" y="128" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="600">J_style(S, G)</text>
<text x="440" y="152" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">how similar is the</text>
<text x="440" y="170" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">style of G to S?</text>
<line x1="560" y1="150" x2="620" y2="150" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah-9ca3af)"/>
<rect x="628" y="90" width="230" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="743" y="128" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="600">J(G)</text>
<text x="743" y="156" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">α J_content  +  β J_style</text>
<text x="743" y="180" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">α, β  hyperparameters</text>
<text x="460" y="264" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Two knobs are redundant — the ratio α/β is what matters — but Gatys, Ecker, and Bethge used both, so the notes do too.</text>
<text x="460" y="282" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Minimize J(G) with gradient descent on the pixels of G. The ConvNet weights stay frozen.</text>
</g>
</svg>
