<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" width="1000" height="572">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="1000" height="572" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="500" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Where sequence models are used</text>
<text x="500" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">X, Y, or both can be a sequence — and every input tensor is the sequence axis T_x followed by one position</text>
<text x="40" y="80" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="600">task</text>
<text x="245" y="80" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="600">input X</text>
<text x="490" y="80" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="600">tensor of one X</text>
<text x="610" y="80" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="600">output Y</text>
<text x="800" y="80" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="600">which side</text>
<line x1="32" y1="88" x2="968" y2="88" stroke="#9ca3af" stroke-width="1"/>
<rect x="32" y="96" width="936" height="46" rx="4" fill="#f9fafb" stroke="none" stroke-width="0"/>
<text x="40" y="123" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Speech recognition</text>
<text x="245" y="123" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">an audio clip, played out over time</text>
<text x="490" y="123" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, n_mel)</text>
<text x="610" y="123" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">"the apple and pear salad"</text>
<rect x="800" y="110" width="71.8" height="18" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.1"/>
<text x="835.9" y="122.6" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="600">seq → seq</text>
<text x="40" y="169" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Music generation</text>
<text x="245" y="169" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">∅, a genre, or a first note</text>
<text x="490" y="169" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(1,) or ∅</text>
<text x="610" y="169" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">a sequence of notes</text>
<rect x="800" y="156" width="47" height="18" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
<text x="823.5" y="168.6" font-size="10" text-anchor="middle" fill="#2563eb" font-weight="600">→ seq</text>
<rect x="32" y="188" width="936" height="46" rx="4" fill="#f9fafb" stroke="none" stroke-width="0"/>
<text x="40" y="215" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Sentiment classification</text>
<text x="245" y="215" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">"nothing to like in this movie"</text>
<text x="490" y="215" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, V)</text>
<text x="610" y="215" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">1 of 5 stars</text>
<rect x="800" y="202" width="47" height="18" rx="9" fill="#ffffff" stroke="#ca8a04" stroke-width="1.1"/>
<text x="823.5" y="214.6" font-size="10" text-anchor="middle" fill="#ca8a04" font-weight="600">seq →</text>
<text x="40" y="261" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">DNA sequence analysis</text>
<text x="245" y="261" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">A G C C C C T G T G A G G</text>
<text x="490" y="261" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, 4)</text>
<text x="610" y="261" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">which part codes a protein</text>
<rect x="800" y="248" width="71.8" height="18" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.1"/>
<text x="835.9" y="260.6" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="600">seq → seq</text>
<rect x="32" y="280" width="936" height="46" rx="4" fill="#f9fafb" stroke="none" stroke-width="0"/>
<text x="40" y="307" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Machine translation</text>
<text x="245" y="307" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Voulez-vous chanter avec moi?</text>
<text x="490" y="307" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, V)</text>
<text x="610" y="307" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Do you want to sing with me?</text>
<rect x="800" y="294" width="140" height="18" rx="9" fill="#ffffff" stroke="#db2777" stroke-width="1.1"/>
<text x="870" y="306.6" font-size="10" text-anchor="middle" fill="#db2777" font-weight="600">seq → seq, T_x ≠ T_y</text>
<text x="40" y="353" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Video activity recognition</text>
<text x="245" y="353" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">a sequence of video frames</text>
<text x="490" y="353" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, h, w, 3)</text>
<text x="610" y="353" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">"running"</text>
<rect x="800" y="340" width="47" height="18" rx="9" fill="#ffffff" stroke="#ca8a04" stroke-width="1.1"/>
<text x="823.5" y="352.6" font-size="10" text-anchor="middle" fill="#ca8a04" font-weight="600">seq →</text>
<rect x="32" y="372" width="936" height="46" rx="4" fill="#f9fafb" stroke="none" stroke-width="0"/>
<text x="40" y="399" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Name entity recognition</text>
<text x="245" y="399" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">Harry Potter and Hermione …</text>
<text x="490" y="399" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, V)</text>
<text x="610" y="399" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">1 1 0 1 1 0 0 0 0</text>
<rect x="800" y="386" width="140" height="18" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.1"/>
<text x="870" y="398.6" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="600">seq → seq, T_x = T_y</text>
<text x="40" y="445" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Time series forecasting</text>
<text x="245" y="445" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">the last T_x readings of demand</text>
<text x="490" y="445" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(T_x, d)</text>
<text x="610" y="445" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">the next H values</text>
<rect x="800" y="432" width="127.6" height="18" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
<text x="863.8" y="444.6" font-size="10" text-anchor="middle" fill="#7c3aed" font-weight="600">seq → seq, T_y = H</text>
<rect x="32" y="464" width="936" height="46" rx="4" fill="#f9fafb" stroke="none" stroke-width="0"/>
<text x="40" y="491" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">Panel data</text>
<text x="245" y="491" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">d features for each of N entities</text>
<text x="490" y="491" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">(N, T_x, d)</text>
<text x="610" y="491" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">one series per entity</text>
<rect x="800" y="478" width="146.2" height="18" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.1"/>
<text x="873.1" y="490.6" font-size="10" text-anchor="middle" fill="#7c3aed" font-weight="600">seq → seq, N is batch</text>
<text x="500" y="536" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Every one of these is supervised learning on labelled (X, Y) pairs. What varies is which side is a sequence, how long each side is,</text>
<text x="500" y="552" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">and what sits at a single position. Add a leading mini-batch dimension m and these are the shapes a framework actually receives.</text>
</g>
</svg>
