<text x="750" y="262" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">Learn the ConvNet parameters</text>
<text x="750" y="280" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">so that these two conditions hold</text>
<text x="750" y="306" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">DeepFace  ·  Taigman et al.</text>
<text x="460" y="382" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The two towers are not two networks. They are one network, run twice, with the weights tied.</text>
