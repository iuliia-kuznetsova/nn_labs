<text x="630" y="272" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">signed horizontal edges</text>
<rect x="64" y="305" width="40" height="17" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<text x="84" y="317" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="600">±30</text>
<text x="116" y="317" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">the window sits fully on one edge: bright above and dark below, or the reverse</text>
<rect x="64" y="327" width="40" height="17" rx="3" fill="#ffffff" stroke="#ca8a04" stroke-width="1.4"/>
<text x="84" y="339" font-size="10.5" text-anchor="middle" fill="#ca8a04" font-weight="600">±10</text>
<text x="116" y="339" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">the window spans a positive and a negative edge at once, so the two contributions partly cancel</text>
<rect x="64" y="349" width="40" height="17" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="84" y="361" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="600">0</text>
<text x="116" y="361" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">the window is inside a uniform block, so the +1 and −1 rows cancel exactly (the top and bottom output rows)</text>
<text x="460" y="392" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The ±10 values are an artifact of a 6×6 image; on a large image these transition cells are negligible.</text>
