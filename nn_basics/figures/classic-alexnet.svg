<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">AlexNet  ·  ImageNet 1000 classes  ·  ~60 M parameters</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">(227−11)/4+1 = 55 → 27 → 13 → 6;  same building blocks as LeNet-5, ~1000× more parameters</text>
