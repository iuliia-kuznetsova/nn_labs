<rect width="920" height="380" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Style is correlation between channels</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">“vertical texture co-occurs with orange” is a style fact, not a content fact</text>
<rect x="142" y="68" width="150" height="150" rx="3" fill="#e9d5ff" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="124" y="76" width="150" height="150" rx="3" fill="#bfdbfe" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="106" y="84" width="150" height="150" rx="3" fill="#bbf7d0" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="88" y="92" width="150" height="150" rx="3" fill="#fde68a" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="70" y="100" width="150" height="150" rx="3" fill="#fecaca" stroke="#9ca3af" stroke-width="1.2"/>
<text x="181" y="278" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">layer ℓ  ·  nH × nW × nC</text>
<rect x="70" y="100" width="150" height="150" rx="3" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<text x="145" y="88" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="600">channel k  (vertical texture)</text>
<line x1="322" y1="140" x2="430" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="440" y="78" width="440" height="230" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="660" y="104" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">At each spatial position (i, j)</text>
<text x="660" y="128" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">read the pair  (a_ijk ,  a_ijk′)</text>
<text x="660" y="164" font-size="12.5" text-anchor="middle" fill="#16a34a" font-weight="600">highly correlated</text>
<text x="660" y="182" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">wherever there is that vertical texture,</text>
<text x="660" y="198" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">there is also that orange tint</text>
<text x="660" y="230" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="600">uncorrelated</text>
<text x="660" y="248" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">the texture appears without the tint</text>
<text x="660" y="280" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">style  =  which features tend to occur together</text>
<text x="460" y="362" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Content asks what is present. Style asks which textures and colours keep showing up in the same places.</text>
</g>
</svg>
