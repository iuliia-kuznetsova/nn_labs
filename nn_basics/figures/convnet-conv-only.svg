<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="270" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">A convolution-only ConvNet  ·  cat / not cat</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">no pooling and no hidden fully connected layers — spatial size 39 → 37 → 17 → 7, channels 3 → 10 → 20 → 40</text>
<rect x="30" y="92" width="18.3978" height="72" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="39.1989" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">39×39×3</text>
<text x="39.1989" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="190.253" y="93.2034" width="26.2346" height="69.5932" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="203.37" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">37×37×10</text>
<text x="203.37" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV1</text>
<rect x="358.343" y="105.923" width="34.0914" height="44.1543" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="375.389" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">17×17×20</text>
<text x="375.389" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV2</text>
<rect x="534.29" y="113.114" width="46" height="29.7729" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="557.29" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">7×7×40</text>
<text x="557.29" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV3</text>
<rect x="722.145" y="95" width="13" height="66" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="728.645" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">1,960</text>
<text x="728.645" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="877" y="118.947" width="13" height="18.1068" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="883.5" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">ŷ</text>
<text x="883.5" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">logistic</text>
<line x1="52.3978" y1="128" x2="186.253" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="119.325" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">10 filters 3×3</text>
<text x="119.325" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">s=1, p=0</text>
<line x1="220.488" y1="128" x2="354.343" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="287.415" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">20 filters 5×5</text>
<text x="287.415" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">s=2, p=0</text>
<line x1="396.434" y1="128" x2="530.29" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="463.362" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">40 filters 5×5</text>
<text x="463.362" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">s=2, p=0</text>
<line x1="584.29" y1="128" x2="718.145" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="651.217" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">flatten</text>
<text x="651.217" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">7·7·40</text>
<line x1="739.145" y1="128" x2="873" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="806.072" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">logistic or</text>
<text x="806.072" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">softmax</text>
<rect x="30" y="219" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="46" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input</text>
<rect x="102.55" y="219" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="118.55" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">CONV</text>
<rect x="168.59" y="219" width="11" height="11" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="184.59" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">POOL</text>
<rect x="234.63" y="219" width="11" height="11" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.1"/>
<text x="250.63" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="320.2" y="219" width="11" height="11" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.1"/>
<text x="336.2" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">FC</text>
<rect x="373.22" y="219" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="389.22" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">softmax / ReLU</text>
<text x="460" y="254" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Stride 2 shrinks the representation far faster than stride 1: 37 → 17 → 7 in two layers.</text>
</g>
</svg>
