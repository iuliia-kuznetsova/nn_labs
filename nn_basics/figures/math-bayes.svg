<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="640" height="280" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="320" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Bayes: posterior from likelihood and prior</text>
<text x="320" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">P(A|B) = P(B|A) P(A) / P(B)</text>
<ellipse cx="260" cy="160" rx="140" ry="80" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<ellipse cx="380" cy="160" rx="140" ry="80" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="260" y="160" font-size="16" text-anchor="middle" fill="#111827" font-weight="600">A</text>
<text x="380" y="160" font-size="16" text-anchor="middle" fill="#111827" font-weight="600">B</text>
<text x="320" y="160" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">A∩B</text>
<text x="320" y="244" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The posterior reweights the prior by how well A explains the evidence B.</text>
</g>
</svg>
