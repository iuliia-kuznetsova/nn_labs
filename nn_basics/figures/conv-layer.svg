<line x1="450" y1="128" x2="484" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="488" y="108" width="62" height="40" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="519" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">ReLU</text>
<line x1="554" y1="128" x2="588" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="592" y="106" width="44" height="44" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="614" y="131" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">4×4</text>
<text x="614" y="98" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a1</text>
<line x1="640" y1="128" x2="686" y2="178" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="132" y1="190" x2="184" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="190" y="230" width="72" height="40" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="226" y="254" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">filter 2</text>
<text x="226" y="222" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3×3×3</text>
<line x1="266" y1="250" x2="300" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="304" y="230" width="44" height="40" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="326" y="254" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">4×4</text>
<text x="326" y="222" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">z2</text>
<line x1="352" y1="250" x2="386" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="390" y="230" width="56" height="40" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
<text x="418" y="254" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">+ b₂</text>
<line x1="450" y1="250" x2="484" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="488" y="230" width="62" height="40" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="519" y="254" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">ReLU</text>
<line x1="554" y1="250" x2="588" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="592" y="228" width="44" height="44" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="614" y="253" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">4×4</text>
<text x="614" y="220" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a2</text>
<line x1="640" y1="250" x2="686" y2="194" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="699" y="157" width="48" height="48" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="690" y="166" width="48" height="48" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="723" y="254" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">4×4×2</text>
<text x="723" y="270" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">a[l]</text>
<text x="723" y="138" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">stack</text>
<rect x="52" y="300" width="400" height="76" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="252" y="326" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">z[l] = W[l] ∗ a[l−1] + b[l]</text>
<text x="252" y="352" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">a[l] = g( z[l] )</text>
<text x="252" y="370" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">exactly the dense-layer equations, with ∗ in place of a matrix product</text>
<rect x="486" y="300" width="382" height="76" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="500" y="324" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">One bias per filter, broadcast to all 16 positions of that map.</text>
<text x="500" y="344" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">Parameters here: (3 · 3 · 3 + 1) × 2 = 56 — independent of</text>
<text x="500" y="364" font-size="10.5" text-anchor="start" fill="#111827" font-weight="600">the input's height and width.</text>
</g>
</svg>
