<rect width="920" height="406" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">One layer of a convolutional network</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">convolve, add a bias, apply a non-linearity, then stack the maps</text>
<rect x="68" y="152" width="58" height="58" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="60" y="160" width="58" height="58" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="52" y="168" width="58" height="58" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="81" y="254" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">6×6×3</text>
<text x="81" y="270" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">a[l−1]</text>
<line x1="132" y1="190" x2="184" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="190" y="108" width="72" height="40" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="226" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">filter 1</text>
<text x="226" y="100" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3×3×3</text>
<line x1="266" y1="128" x2="300" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="304" y="108" width="44" height="40" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="326" y="132" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">4×4</text>
<text x="326" y="100" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">z1</text>
<line x1="352" y1="128" x2="386" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="390" y="108" width="56" height="40" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
