<text x="370" y="386" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Both filters have exactly nine learnable weights. The dilated one reaches a 5×5 region because its taps skip a cell in each direction,</text>
<text x="370" y="402" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">which is useful for segmentation, where you want a large field without losing resolution to pooling.</text>
