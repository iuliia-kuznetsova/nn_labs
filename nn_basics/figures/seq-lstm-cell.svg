<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 518" width="920" height="518">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="518" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The long short-term memory unit</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">three gates instead of two, and a&lt;t&gt; is no longer the same thing as c&lt;t&gt;</text>
<rect x="42" y="128" width="124" height="30" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="104" y="146.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">c&lt;t-1&gt;</text>
<rect x="42" y="214" width="124" height="30" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="104" y="232.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a&lt;t-1&gt;</text>
<rect x="42" y="272" width="124" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="104" y="290.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">x&lt;t&gt;</text>
<circle cx="196" cy="244" r="4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/>
<line x1="168" y1="229" x2="196" y2="244" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="168" y1="287" x2="196" y2="244" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="226" y="100" width="92" height="40" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="272" y="119" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Γ_f</text>
<text x="272" y="132" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="normal">forget</text>
<line x1="200" y1="244" x2="224" y2="120" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="226" y="158" width="92" height="40" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="272" y="177" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Γ_u</text>
<text x="272" y="190" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="normal">update</text>
<line x1="200" y1="244" x2="224" y2="178" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="226" y="216" width="92" height="40" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="272" y="235" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">c-tilde&lt;t&gt;</text>
<text x="272" y="248" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="normal">tanh</text>
<line x1="200" y1="244" x2="224" y2="236" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="226" y="296" width="92" height="40" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="272" y="315" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Γ_o</text>
<text x="272" y="328" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="normal">output</text>
<line x1="200" y1="244" x2="224" y2="316" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="408" y="96" width="140" height="160" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="478" y="152" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u ⊙ c-tilde&lt;t&gt;</text>
<text x="478" y="178" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">+</text>
<text x="478" y="204" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_f ⊙ c&lt;t-1&gt;</text>
<line x1="320" y1="120" x2="404" y2="132" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<line x1="320" y1="178" x2="404" y2="170" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<line x1="320" y1="236" x2="404" y2="210" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<path d="M 168 143 C 248 84, 340 78, 406 106" fill="none" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<rect x="558" y="158" width="120" height="36" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="618" y="180.32" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">c&lt;t&gt;</text>
<line x1="550" y1="176" x2="556" y2="176" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#ah-9ca3af)"/>
<rect x="558" y="280" width="120" height="36" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="618" y="302.32" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">a&lt;t&gt;</text>
<line x1="618" y1="196" x2="618" y2="276" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="320" y1="316" x2="556" y2="300" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah-9ca3af)"/>
<text x="618" y="332" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a&lt;t&gt; = Γ_o ⊙ c&lt;t&gt;</text>
<rect x="782" y="280" width="96" height="32" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="830" y="299.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;t&gt;</text>
<line x1="680" y1="298" x2="780" y2="298" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="782" y="120" width="118" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text x="841" y="144" font-size="10.5" text-anchor="middle" fill="#7c3aed" font-weight="600">Variation</text>
<text x="841" y="164" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">peephole:</text>
<text x="841" y="178" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">the gates also</text>
<text x="841" y="192" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">see c&lt;t-1&gt;,</text>
<text x="841" y="206" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">element by element</text>
<line x1="40" y1="358" x2="880" y2="358" stroke="#9ca3af" stroke-width="1"/>
<rect x="48" y="378" width="400" height="96" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="248" y="402" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u = σ(W_u [a&lt;t-1&gt;, x&lt;t&gt;] + b_u)</text>
<text x="248" y="426" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_f = σ(W_f [a&lt;t-1&gt;, x&lt;t&gt;] + b_f)</text>
<text x="248" y="450" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_o = σ(W_o [a&lt;t-1&gt;, x&lt;t&gt;] + b_o)</text>
<rect x="472" y="378" width="400" height="96" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="672" y="402" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">c-tilde&lt;t&gt; = tanh(W_c [a&lt;t-1&gt;, x&lt;t&gt;] + b_c)</text>
<text x="672" y="426" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">c&lt;t&gt; = Γ_u ⊙ c-tilde&lt;t&gt; + Γ_f ⊙ c&lt;t-1&gt;</text>
<text x="672" y="450" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">a&lt;t&gt; = Γ_o ⊙ c&lt;t&gt;</text>
<text x="460" y="498" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Separate update and forget gates mean the unit can add to the old value instead of having to trade against it, which is what 1 − Γ_u forces in a GRU.</text>
</g>
</svg>
