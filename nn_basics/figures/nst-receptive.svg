<rect width="920" height="280" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Deeper units see more of the image</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a layer-1 unit looks at a small patch; a deep unit can be affected by every pixel</text>
<rect x="80" y="80" width="280" height="140" rx="4" fill="#e8eef5" stroke="#9ca3af" stroke-width="1.3"/>
<rect x="80" y="161.2" width="280" height="58.8" rx="0" fill="#86efac" stroke="none" stroke-width="0"/>
<line x1="80" y1="161.2" x2="360" y2="161.2" stroke="#4ade80" stroke-width="1"/>
<rect x="158.4" y="110.8" width="123.2" height="61.6" rx="2" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2"/>
<rect x="203.2" y="133.2" width="33.6" height="39.2" rx="1" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
<rect x="175.2" y="122" width="22.4" height="11.2" rx="1" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<rect x="242.4" y="122" width="22.4" height="11.2" rx="1" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<rect x="116" y="108" width="44" height="44" rx="2" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="138" y="100" font-size="10.5" text-anchor="middle" fill="#16a34a" font-weight="600">layer 1</text>
<rect x="150" y="98" width="180" height="104" rx="2" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="240" y="92" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="600">deeper layer</text>
<line x1="376" y1="150" x2="430" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah-9ca3af)"/>
<rect x="440" y="84" width="14" height="14" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="0"/>
<text x="468" y="96" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Layer 1</text>
<text x="468" y="114" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">small patch  ·  edge, a shade of colour</text>
<rect x="440" y="126" width="14" height="14" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="468" y="138" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Layer 2–3</text>
<text x="468" y="156" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">larger patch  ·  texture, honeycomb, round shapes</text>
<rect x="440" y="168" width="14" height="14" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="0"/>
<text x="468" y="180" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Layer 4–5</text>
<text x="468" y="198" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">much of the image  ·  dog, keyboard, flower</text>
<text x="460" y="262" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">That is why a shallow content layer copies pixels, and a deep one only asks that “a dog is somewhere.”</text>
</g>
</svg>
