<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 248" width="920" height="248">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="248" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Step 1  ·  take one value from the input</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the running example starts with the top-left 1; the same steps then run for 2, 3, and 4</text>
<rect x="250" y="86" width="42" height="42" fill="#fecaca" stroke="#9ca3af" stroke-width="1.2"/>
<text x="271" y="110.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">1</text>
<rect x="292" y="86" width="42" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="313" y="110.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">2</text>
<rect x="250" y="128" width="42" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="271" y="152.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">3</text>
<rect x="292" y="128" width="42" height="42" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="313" y="152.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">4</text>
<rect x="250" y="86" width="42" height="42" fill="none" stroke="#dc2626" stroke-width="2.6"/>
<text x="292" y="186" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">input</text>
<line x1="346" y1="107" x2="420" y2="107" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="436" y="86" width="42" height="42" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<text x="457" y="112.76" font-size="16" text-anchor="middle" fill="#111827" font-weight="normal">1</text>
<text x="457" y="186" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">the value we use next</text>
<text x="460" y="232" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">A transpose convolution never looks at a window of the input. It picks one number and expands it.</text>
</g>
</svg>
