<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 444" width="920" height="444">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="444" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Choosing a recurrent unit</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">more gates buys longer memory and costs parameters</text>
<rect x="40" y="80" width="274" height="300" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="177" y="108" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">Basic RNN</text>
<text x="60" y="134" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">state</text>
<rect x="60" y="140" width="214" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="167" y="155" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">a&lt;t&gt;</text>
<text x="60" y="200" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">gates</text>
<text x="167" y="221" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">none</text>
<text x="60" y="300" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">parameters per layer</text>
<rect x="60" y="308" width="50" height="14" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<text x="118" y="319" font-size="10" text-anchor="start" fill="#111827" font-weight="600">≈ 1×</text>
<text x="177" y="344" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one tanh, no gates</text>
<text x="177" y="358" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">local influence only:</text>
<text x="177" y="372" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">forgets long-range dependencies</text>
<rect x="334" y="80" width="274" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="471" y="108" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="600">GRU</text>
<text x="354" y="134" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">state</text>
<rect x="354" y="140" width="214" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="461" y="155" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">c&lt;t&gt; = a&lt;t&gt;</text>
<text x="354" y="200" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">gates</text>
<rect x="354" y="206" width="214" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="461" y="221" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u  update</text>
<rect x="354" y="232" width="214" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="461" y="247" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_r  relevance</text>
<text x="354" y="300" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">parameters per layer</text>
<rect x="354" y="308" width="150" height="14" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="512" y="319" font-size="10" text-anchor="start" fill="#16a34a" font-weight="600">≈ 3×</text>
<text x="471" y="344" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">simpler, so easier to scale</text>
<text x="471" y="358" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">to a much bigger network</text>
<text x="471" y="372" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">often just as good</text>
<rect x="628" y="80" width="274" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="765" y="108" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="600">LSTM</text>
<text x="648" y="134" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">state</text>
<rect x="648" y="140" width="214" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="755" y="155" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">c&lt;t&gt;</text>
<rect x="648" y="166" width="214" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="755" y="181" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">a&lt;t&gt;  (separate)</text>
<text x="648" y="200" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">gates</text>
<rect x="648" y="206" width="214" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="755" y="221" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_u  update</text>
<rect x="648" y="232" width="214" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="755" y="247" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_f  forget</text>
<rect x="648" y="258" width="214" height="22" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="755" y="273" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">Γ_o  output</text>
<text x="648" y="300" font-size="9.5" text-anchor="start" fill="#6b7280" font-weight="600">parameters per layer</text>
<rect x="648" y="308" width="200" height="14" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="856" y="319" font-size="10" text-anchor="start" fill="#2563eb" font-weight="600">≈ 4×</text>
<text x="765" y="344" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">more powerful and flexible</text>
<text x="765" y="358" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">historically the more proven</text>
<text x="765" y="372" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">default first thing to try</text>
<text x="460" y="408" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">There is no universally better choice, and on different problems different units win. Both gated units fix the vanishing-gradient problem the same way:</text>
<text x="460" y="424" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a state the unit can choose to leave alone.</text>
</g>
</svg>
