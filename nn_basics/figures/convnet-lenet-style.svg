<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="270" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">A LeNet-5-inspired ConvNet  ·  10 digit classes  ·  ~62 K parameters</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV → POOL repeated, then fully connected layers, then softmax — the standard template</text>
<rect x="30" y="92" width="23.8194" height="72" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="41.9097" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">32×32×3</text>
<text x="41.9097" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<rect x="132.734" y="94.9507" width="30.4306" height="66.0986" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="147.95" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×6</text>
<text x="147.95" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV1</text>
<rect x="242.08" y="105.88" width="30.4306" height="44.2392" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="257.295" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">14×14×6</text>
<text x="257.295" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">POOL1</text>
<rect x="351.425" y="109.268" width="46" height="37.4637" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="374.425" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">10×10×16</text>
<text x="374.425" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">CONV2</text>
<rect x="476.34" y="113.824" width="46" height="28.353" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="499.34" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">5×5×16</text>
<text x="499.34" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">POOL2</text>
<rect x="601.255" y="95" width="13" height="66" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="607.755" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">400</text>
<text x="607.755" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="693.17" y="106.081" width="13" height="43.8384" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="699.67" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">120</text>
<text x="699.67" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">FC3</text>
<rect x="785.085" y="108.273" width="13" height="39.4546" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="791.585" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">84</text>
<text x="791.585" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">FC4</text>
<rect x="877" y="115.626" width="13" height="24.7476" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="883.5" y="186" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">10</text>
<text x="883.5" y="200" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">softmax</text>
<line x1="57.8194" y1="128" x2="128.734" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="93.2769" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">6 filters 5×5</text>
<text x="93.2769" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">s=1, p=0</text>
<line x1="167.165" y1="128" x2="238.08" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="202.622" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">max pool</text>
<text x="202.622" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">f=2, s=2</text>
<line x1="276.511" y1="128" x2="347.425" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="311.968" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">16 filters 5×5</text>
<text x="311.968" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">s=1, p=0</text>
<line x1="401.425" y1="128" x2="472.34" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="436.883" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">max pool</text>
<text x="436.883" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">f=2, s=2</text>
<line x1="526.34" y1="128" x2="597.255" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="561.798" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">flatten</text>
<text x="561.798" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">5·5·16</text>
<line x1="618.255" y1="128" x2="689.17" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="653.713" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">fully</text>
<text x="653.713" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">connected</text>
<line x1="710.17" y1="128" x2="781.085" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="745.628" y="56" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">fully</text>
<text x="745.628" y="68" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">connected</text>
<line x1="802.085" y1="128" x2="873" y2="128" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="837.543" y="62" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">10 classes</text>
<rect x="30" y="219" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="46" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input</text>
<rect x="102.55" y="219" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="118.55" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">CONV</text>
<rect x="168.59" y="219" width="11" height="11" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="184.59" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">POOL</text>
<rect x="234.63" y="219" width="11" height="11" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.1"/>
<text x="250.63" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="320.2" y="219" width="11" height="11" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.1"/>
<text x="336.2" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">FC</text>
<rect x="373.22" y="219" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="389.22" y="228" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">softmax / ReLU</text>
<text x="460" y="254" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Counting only layers with weights, CONV1+POOL1 together are layer 1 and CONV2+POOL2 are layer 2.</text>
</g>
</svg>
