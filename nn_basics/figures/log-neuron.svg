<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="720" height="280" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="360" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Logistic regression is a one-neuron network</text>
<text x="360" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">linear score, then sigmoid, then a probability</text>
<rect x="50" y="122" width="80" height="56" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="90" y="154" font-size="14" text-anchor="middle" fill="#111827" font-weight="normal">x</text>
<rect x="170" y="122" width="80" height="56" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="210" y="154" font-size="13" text-anchor="middle" fill="#111827" font-weight="normal">w, b</text>
<rect x="326" y="122" width="88" height="56" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="370" y="154" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">z = w⊤x + b</text>
<rect x="480" y="122" width="80" height="56" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="520" y="154" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">a = σ(z)</text>
<rect x="604" y="122" width="72" height="56" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="640" y="154" font-size="14" text-anchor="middle" fill="#111827" font-weight="normal">ŷ</text>
<line x1="134" y1="150" x2="166" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="254" y1="150" x2="326" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="414" y1="150" x2="476" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="564" y1="150" x2="596" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="360" y="244" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">No hidden layer: one linear unit plus a sigmoid. The decision boundary is linear in the original features.</text>
<rect x="70" y="253" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="86" y="262" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input</text>
<rect x="142.55" y="253" width="11" height="11" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.1"/>
<text x="158.55" y="262" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">parameters</text>
<rect x="247.65" y="253" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="263.65" y="262" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">logit</text>
<rect x="320.2" y="253" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="336.2" y="262" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">sigmoid / output</text>
</g>
</svg>
