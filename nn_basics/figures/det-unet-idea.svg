<text x="289.5" y="214" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">down:  the picture gets smaller, the meaning gets richer</text>
<text x="545.5" y="214" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">up:  the picture comes back, one class per pixel</text>
<text x="407" y="236" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">here you know what, but not which pixel</text>
<text x="460" y="284" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">That is the whole idea. The next figure is how U-Net actually arranges the layers.</text>
