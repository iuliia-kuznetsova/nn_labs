<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="920" height="490">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="490" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Forward propagation through one cell</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one linear step, one non-linearity, one output head — then the same thing again at t + 1</text>
<rect x="48" y="142" width="112" height="32" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="104" y="161.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a&lt;t-1&gt;</text>
<rect x="48" y="206" width="112" height="32" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="104" y="225.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">x&lt;t&gt;</text>
<line x1="160" y1="158" x2="208" y2="166" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="160" y1="222" x2="208" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="214" y="134" width="168" height="96" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="298" y="164" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal">W_aa a&lt;t-1&gt;</text>
<text x="298" y="184" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal">+ W_ax x&lt;t&gt;</text>
<text x="298" y="204" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal">+ b_a</text>
<line x1="384" y1="182" x2="416" y2="182" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="420" y="164" width="84" height="36" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="462" y="186.14" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">tanh</text>
<line x1="506" y1="182" x2="540" y2="182" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="548" y="164" width="96" height="36" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="596" y="186.32" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">a&lt;t&gt;</text>
<line x1="646" y1="162" x2="646" y2="132" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="566" y="72" width="160" height="58" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="646" y="106" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">W_ya a&lt;t&gt; + b_y</text>
<line x1="732" y1="101" x2="764" y2="101" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="776" y="82" width="116" height="36" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="834" y="104.14" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;t&gt;</text>
<text x="834" y="134" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">sigmoid or softmax</text>
<line x1="646" y1="202" x2="646" y2="234" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="680" y="234" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">carried to t + 1</text>
<rect x="48" y="286" width="824" height="162" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="56" y="276" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Simplifying the notation: stack the two matrices</text>
<rect x="80" y="324" width="92" height="58" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="126" y="358" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">W_aa</text>
<text x="126" y="398" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">100 × 100</text>
<rect x="172" y="324" width="240" height="58" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="292" y="358" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">W_ax</text>
<text x="292" y="398" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">100 × 10,000</text>
<text x="246" y="312" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="600">W_a = [ W_aa | W_ax ],  100 × 10,100</text>
<text x="438" y="358" font-size="18" text-anchor="middle" fill="#6b7280" font-weight="600">×</text>
<rect x="468" y="324" width="74" height="18" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="505" y="337" font-size="10" text-anchor="middle" fill="#111827" font-weight="normal">a&lt;t-1&gt;</text>
<rect x="468" y="342" width="74" height="40" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="505" y="366" font-size="10" text-anchor="middle" fill="#111827" font-weight="normal">x&lt;t&gt;</text>
<text x="505" y="398" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">10,100 × 1</text>
<text x="570" y="358" font-size="16" text-anchor="middle" fill="#6b7280" font-weight="600">=</text>
<rect x="600" y="328" width="288" height="50" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="744" y="358" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">W_aa a&lt;t-1&gt; + W_ax x&lt;t&gt;</text>
<text x="744" y="398" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one parameter matrix instead of two</text>
<text x="460" y="470" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">a&lt;t&gt; = g(W_a [a&lt;t-1&gt;, x&lt;t&gt;] + b_a)   and   y-hat&lt;t&gt; = g(W_y a&lt;t&gt; + b_y).   The subscript names the output: a-like or y-like.</text>
</g>
</svg>
