<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="780" height="240" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="390" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Batch norm sits between the linear map and the nonlinearity</text>
<text x="390" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">normalize the batch, then scale and shift with learned γ, β</text>
<rect x="24" y="120" width="120" height="50" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="84" y="149" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">A[ℓ−1]</text>
<rect x="176" y="120" width="120" height="50" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="236" y="149" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">Z = WA</text>
<rect x="328" y="120" width="120" height="50" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="388" y="149" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">normalize</text>
<rect x="480" y="120" width="120" height="50" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="540" y="149" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">γ ⊙ + β</text>
<rect x="632" y="120" width="120" height="50" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="692" y="149" font-size="12" text-anchor="middle" fill="#111827" font-weight="normal">g(·) → A[ℓ]</text>
<line x1="152" y1="145" x2="168" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="304" y1="145" x2="320" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="456" y1="145" x2="472" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="608" y1="145" x2="624" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
</g>
