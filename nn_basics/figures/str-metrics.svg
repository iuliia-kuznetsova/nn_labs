<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="720" height="280" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="360" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">One optimizing metric, the rest are constraints</text>
<text x="360" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">maximize accuracy subject to runtime ≤ 100 ms</text>
<line x1="80" y1="220" x2="660" y2="220" stroke="#111827" stroke-width="1.4"/>
<line x1="80" y1="220" x2="80" y2="70" stroke="#111827" stroke-width="1.4"/>
<text x="370" y="248" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal">runtime (ms)</text>
<text x="40" y="145" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal" transform="rotate(-90 40 145)">accuracy</text>
<line x1="370" y1="70" x2="370" y2="220" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="378" y="84" font-size="11" text-anchor="start" fill="#dc2626" font-weight="600">100 ms  ·  satisficing</text>
<circle cx="283" cy="137.5" r="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="283" y="141.5" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">A</text>
<circle cx="239.5" cy="175" r="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="239.5" y="179" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">B</text>
<circle cx="335.2" cy="115" r="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="335.2" y="119" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">C</text>
<circle cx="558.5" cy="92.5" r="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="558.5" y="96.5" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">D</text>
<circle cx="399" cy="152.5" r="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="399" y="156.5" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">E</text>
<circle cx="515" cy="190" r="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
<text x="515" y="194" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">F</text>
<text x="360" y="256" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Model D is most accurate but too slow. Among models that pass the threshold, pick the highest accuracy.</text>
</g>
</svg>
