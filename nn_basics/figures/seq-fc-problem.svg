<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-ea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="920" height="420" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Why a standard network does not work here</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">three problems, all of which a recurrent network avoids</text>
<rect x="32" y="78" width="264" height="236" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="40" y="68" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">1.  Lengths differ</text>
<rect x="48" y="112" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="68" y="112" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="88" y="112" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="108" y="112" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="128" y="112" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<text x="228" y="124" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">T_x = 5</text>
<rect x="48" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="68" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="88" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="108" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="128" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="148" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="168" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="188" y="166" width="16" height="16" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<text x="216" y="179" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="normal">…</text>
<text x="228" y="178" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">T_x = 12</text>
<rect x="48" y="230" width="160" height="40" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="128" y="254" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">fixed input layer</text>
<text x="230" y="254" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="600">✗</text>
<text x="164" y="292" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Zero-padding to a maximum length is</text>
<text x="164" y="306" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">possible but still a poor representation.</text>
<rect x="328" y="78" width="264" height="236" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="336" y="68" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">2.  Nothing is shared across positions</text>
<rect x="344" y="116" width="74" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="381" y="136" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Harry</text>
<text x="381" y="160" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">position 1</text>
<line x1="424" y1="131" x2="460" y2="131" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="466" y="112" width="108" height="38" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="520" y="135" font-size="10.5" text-anchor="middle" fill="#16a34a" font-weight="600">✓ name</text>
<rect x="344" y="178" width="74" height="30" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="381" y="198" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Harry</text>
<text x="381" y="222" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">position 7</text>
<line x1="424" y1="193" x2="460" y2="193" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="466" y="174" width="108" height="38" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="520" y="197" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="600">?  own weights</text>
<text x="460" y="264" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">What the network learns about Harry at</text>
<text x="460" y="278" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one position does not transfer to another,</text>
<text x="460" y="292" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the way a filter transfers across an image.</text>
<rect x="624" y="78" width="264" height="236" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="632" y="68" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">3.  The first weight matrix explodes</text>
<rect x="642" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="666" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="690" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="714" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="738" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="762" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="786" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="810" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<rect x="834" y="114" width="18" height="96" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
<text x="750" y="224" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">9 one-hot vectors × 10,000</text>
<line x1="750" y1="234" x2="750" y2="256" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="658" y="260" width="184" height="34" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="750" y="282" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">W[1] has ≈ 90,000 columns</text>
<text x="756" y="310" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">One weight per input unit per hidden unit.</text>
<rect x="120" y="348" width="680" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="460" y="373" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">A recurrent network fixes all three: one shared parameter set, scanned over a sequence of any length</text>
</g>
</svg>
