<text x="532" y="342" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">centre pixel: 9 windows</text>
<text x="390" y="370" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Each cell counts the filter positions that see that pixel. Without padding a corner is read once while a central pixel is read nine times,</text>
<text x="390" y="386" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">so information near the border is effectively discarded. A one-pixel border raises the corner from 1 to 4.</text>
