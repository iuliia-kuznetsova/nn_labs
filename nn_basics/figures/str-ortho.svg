<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="760" height="280" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="380" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Orthogonal knobs</text>
<text x="380" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one control per failure mode</text>
<rect x="40" y="80" width="280" height="36" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="180" y="104" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">fit the training set</text>
<line x1="332" y1="98" x2="390" y2="98" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="400" y="104" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">bigger model, train longer, better optimizer</text>
<rect x="40" y="126" width="280" height="36" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="180" y="150" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">generalize to dev</text>
<line x1="332" y1="144" x2="390" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="400" y="150" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">regularize, more data, augment</text>
<rect x="40" y="172" width="280" height="36" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="180" y="196" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">dev → test</text>
<line x1="332" y1="190" x2="390" y2="190" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="400" y="196" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">larger / better dev set</text>
<rect x="40" y="218" width="280" height="36" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="180" y="242" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">metric matches the product</text>
<line x1="332" y1="236" x2="390" y2="236" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="400" y="242" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">change metric or the target distribution</text>
</g>
</svg>
