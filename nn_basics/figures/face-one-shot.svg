<text x="720" y="268" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="600">only Danielle is below τ</text>
<text x="720" y="292" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the other three are all ≫ τ</text>
<text x="720" y="318" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="600">predict: Danielle</text>
<text x="720" y="342" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">if every d &gt; τ  →  not in the database</text>
<text x="460" y="402" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">If every d is above τ the person is not in the database. Adding a fifth employee is just adding a fifth photo.</text>
