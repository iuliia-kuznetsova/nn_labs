<rect x="180" y="296" width="220" height="24" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text x="290" y="312" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="600">d = 8.7   &gt;  τ   different</text>
