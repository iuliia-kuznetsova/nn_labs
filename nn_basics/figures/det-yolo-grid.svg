<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">YOLO assigns each object to the cell containing its midpoint</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">an object that spans several cells still belongs to exactly one of them</text>
<rect x="70" y="86" width="264" height="264" rx="4" fill="#eef2f6" stroke="#9ca3af" stroke-width="1.3"/>
<rect x="70" y="249.68" width="264" height="100.32" rx="0" fill="#d6d3d1" stroke="none" stroke-width="0"/>
<line x1="70" y1="249.68" x2="334" y2="249.68" stroke="#c4c0bc" stroke-width="1"/>
<line x1="70" y1="86" x2="334" y2="86" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="70" y1="86" x2="70" y2="350" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="70" y1="174" x2="334" y2="174" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="158" y1="86" x2="158" y2="350" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="70" y1="262" x2="334" y2="262" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="246" y1="86" x2="246" y2="350" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="70" y1="350" x2="334" y2="350" stroke="#9ca3af" stroke-width="1.2"/>
<line x1="334" y1="86" x2="334" y2="350" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="78" y="192" width="110" height="52" rx="4" fill="#bfdbfe" stroke="#dc2626" stroke-width="1.6"/>
<rect x="97.8" y="168.6" width="70.4" height="27.04" rx="3" fill="#bfdbfe" stroke="#dc2626" stroke-width="1.4"/>
<circle cx="114" cy="218" r="4.2" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<rect x="70" y="174" width="88" height="88" rx="0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
<rect x="228" y="202" width="100" height="44" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.6"/>
<rect x="246" y="182.2" width="64" height="22.88" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<circle cx="290" cy="218" r="4.2" fill="#2563eb" stroke="#ffffff" stroke-width="1.4"/>
<rect x="246" y="174" width="88" height="88" rx="0" fill="none" stroke="#2563eb" stroke-width="2.4"/>
<text x="202" y="372" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">3×3 grid for the illustration; a real YOLO uses 19×19</text>
<rect x="400" y="86" width="484" height="250" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="420" y="116" font-size="13" text-anchor="start" fill="#111827" font-weight="600">Assignment rule</text>
<text x="420" y="144" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">Each object → the one cell that contains its midpoint.</text>
<text x="420" y="168" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">The centre cell sees parts of both cars and is still labeled empty,</text>
<text x="420" y="188" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">because neither midpoint lives there.</text>
<line x1="420" y1="208" x2="864" y2="208" stroke="#9ca3af" stroke-width="1"/>
<text x="420" y="234" font-size="13" text-anchor="start" fill="#111827" font-weight="600">y has shape  3 × 3 × 8</text>
<text x="420" y="258" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">8 = pc + (bx, by, bh, bw) + (c1, c2, c3)</text>
<text x="420" y="282" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">Empty cells:  [0,  ?, ?, ?, ?,  ?, ?, ?]</text>
<text x="420" y="306" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">A 19×19 grid is 19 × 19 × 8, and two midpoints rarely collide.</text>
<text x="460" y="384" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">bx, by are relative to the cell (always in [0, 1]). bh, bw are fractions of the cell and can exceed 1 — the object may be larger than its cell.</text>
</g>
</svg>
