<rect x="230" y="110" width="130" height="70" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="295" y="149" font-size="14" text-anchor="middle" fill="#111827" font-weight="normal">edges</text>
<text x="295" y="202" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">layer 1</text>
<line x1="368" y1="145" x2="398" y2="145" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="410" y="110" width="130" height="70" rx="3" fill="#a7f3d0" stroke="#059669" stroke-width="1.4"/>
<text x="475" y="149" font-size="14" text-anchor="middle" fill="#111827" font-weight="normal">parts</text>
<text x="475" y="202" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">layer 2  ·  eye, nose</text>
