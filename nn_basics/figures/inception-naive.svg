<rect width="940" height="422" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="470" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The naive Inception module</text>
<text x="470" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">instead of choosing a filter size, run them all in parallel and concatenate</text>
<rect x="56" y="150" width="84" height="132" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="98" y="212" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">input</text>
<text x="98" y="225" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×192</text>
<line x1="144" y1="216" x2="246" y2="123" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="250" y="92" width="326" height="62" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="413" y="115" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1 conv</text>
<text x="413" y="127" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">64 filters</text>
<text x="413" y="139" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×64</text>
<line x1="580" y1="123" x2="635" y2="123" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="640" y="92" width="84" height="62" rx="0" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="682" y="127" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">64</text>
<line x1="144" y1="216" x2="246" y2="185" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="250" y="154" width="326" height="62" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="413" y="177" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">3×3 conv, same</text>
<text x="413" y="189" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">128 filters</text>
<text x="413" y="201" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×128</text>
<line x1="580" y1="185" x2="635" y2="216" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="640" y="154" width="84" height="124" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
<text x="682" y="220" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">128</text>
<line x1="144" y1="216" x2="246" y2="247" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="250" y="216" width="326" height="62" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="413" y="239" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">5×5 conv, same</text>
<text x="413" y="251" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">32 filters</text>
<text x="413" y="263" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×32</text>
<line x1="580" y1="247" x2="635" y2="293.5" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="640" y="278" width="84" height="31" rx="0" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
<text x="682" y="297.5" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">32</text>
<line x1="144" y1="216" x2="246" y2="309" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="250" y="278" width="326" height="62" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="413" y="301" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">3×3 max pool</text>
<text x="413" y="313" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">same, s=1</text>
<text x="413" y="325" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×32</text>
<line x1="580" y1="309" x2="635" y2="324.5" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="640" y="309" width="84" height="31" rx="0" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="682" y="328.5" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">32</text>
<rect x="640" y="92" width="84" height="248" rx="0" fill="none" stroke="#4b5563" stroke-width="1.8"/>
<text x="682" y="80" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">concatenate</text>
<text x="746" y="202" font-size="11" text-anchor="start" fill="#111827" font-weight="600">channel concatenation</text>
<text x="746" y="226" font-size="14" text-anchor="start" fill="#111827" font-weight="600">28×28×256</text>
<text x="746" y="246" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">64 + 128 + 32 + 32</text>
<rect x="56" y="365" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="72" y="374" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input volume</text>
<rect x="174.12" y="365" width="11" height="11" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.1"/>
<text x="190.12" y="374" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">1×1 conv</text>
<rect x="266.2" y="365" width="11" height="11" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.1"/>
<text x="282.2" y="374" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">3×3 conv</text>
<rect x="358.28" y="365" width="11" height="11" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.1"/>
<text x="374.28" y="374" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">5×5 conv</text>
<rect x="450.36" y="365" width="11" height="11" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.1"/>
<text x="466.36" y="374" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">max pool</text>
<text x="470" y="404" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Every branch keeps 28×28 so the outputs can be stacked. Pooling needs same padding and stride 1 — unusual for max pooling.</text>
</g>
