<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="440" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The residual block</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the shortcut is added after the linear part and before the final ReLU</text>
<text x="30" y="56" font-size="13" text-anchor="start" fill="#111827" font-weight="600">Plain network — the only route is the main path</text>
<circle cx="72" cy="118" r="19" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="72" y="122" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a[l]</text>
<circle cx="352" cy="118" r="19" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="352" y="122" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a[l+1]</text>
<circle cx="692" cy="118" r="19" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="692" y="122" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a[l+2]</text>
<rect x="118" y="98" width="96" height="40" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="166" y="115" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">linear</text>
<text x="166" y="128" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">W[l+1], b[l+1]</text>
<rect x="240" y="98" width="74" height="40" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="277" y="122" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">ReLU</text>
<rect x="398" y="98" width="96" height="40" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="446" y="115" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">linear</text>
<text x="446" y="128" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">W[l+2], b[l+2]</text>
<rect x="578" y="98" width="74" height="40" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="615" y="122" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">ReLU</text>
<line x1="91" y1="118" x2="118" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="214" y1="118" x2="240" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="314" y1="118" x2="333" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="371" y1="118" x2="398" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="656" y1="118" x2="669" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="494" y1="118" x2="578" y2="118" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="460" y="176" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">a[l+2] = g( z[l+2] )</text>
<text x="460" y="194" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">information has to survive both layers to reach a[l+2]</text>
<text x="30" y="218" font-size="13" text-anchor="start" fill="#111827" font-weight="600">Residual block</text>
<circle cx="72" cy="320" r="19" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="72" y="324" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a[l]</text>
<circle cx="352" cy="320" r="19" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="352" y="324" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a[l+1]</text>
<circle cx="692" cy="320" r="19" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="692" y="324" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">a[l+2]</text>
<rect x="118" y="300" width="96" height="40" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="166" y="317" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">linear</text>
<text x="166" y="330" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">W[l+1], b[l+1]</text>
<rect x="240" y="300" width="74" height="40" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="277" y="324" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">ReLU</text>
<rect x="398" y="300" width="96" height="40" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="446" y="317" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">linear</text>
<text x="446" y="330" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">W[l+2], b[l+2]</text>
<rect x="578" y="300" width="74" height="40" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="615" y="324" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">ReLU</text>
<line x1="91" y1="320" x2="118" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="214" y1="320" x2="240" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="314" y1="320" x2="333" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="371" y1="320" x2="398" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="656" y1="320" x2="669" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<circle cx="546" cy="320" r="15" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="546" y="325" font-size="17" text-anchor="middle" fill="#dc2626" font-weight="600">+</text>
<line x1="494" y1="320" x2="531" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="561" y1="320" x2="578" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M 72,299 C 72,242 546,242 546,303" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="309" y="234" font-size="10.5" text-anchor="middle" fill="#dc2626" font-weight="600">shortcut: copy a[l] forward, past both layers</text>
<text x="460" y="378" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">a[l+2] = g( z[l+2] + a[l] )</text>
<text x="460" y="396" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">if W[l+2] = 0 and b[l+2] = 0 then a[l+2] = g(a[l]) = a[l], so the identity is easy to learn</text>
<text x="460" y="424" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Requires z[l+2] and a[l] to have the same dimension — hence the heavy use of same convolutions, or a projection matrix Ws·a[l].</text>
</g>
</svg>
