<rect x="126" y="78" width="88" height="30" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="170" y="96.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;1&gt;</text>
