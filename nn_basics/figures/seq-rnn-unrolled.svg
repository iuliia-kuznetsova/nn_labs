<text x="650" y="172" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">RNN cell</text>
<text x="650" y="185" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal">tanh</text>
<rect x="606" y="248" width="88" height="30" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="650" y="266.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Hermione</text>
