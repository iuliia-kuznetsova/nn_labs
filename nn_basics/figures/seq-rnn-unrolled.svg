<text x="820" y="266.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">spell</text>
<text x="820" y="296" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">t = T_x</text>
<line x1="820" y1="246" x2="820" y2="210" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="820" y1="138" x2="820" y2="112" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="104" y1="173" x2="122" y2="173" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="214" y1="173" x2="282" y2="173" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="374" y1="173" x2="442" y2="173" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="534" y1="173" x2="602" y2="173" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="694" y1="173" x2="722" y2="173" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="735" y="178" font-size="16" text-anchor="middle" fill="#6b7280" font-weight="normal">…</text>
<line x1="748" y1="173" x2="772" y2="173" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="182" y="228" font-size="10" text-anchor="start" fill="#16a34a" font-weight="600">W_ax</text>
<text x="250" y="166" font-size="10" text-anchor="middle" fill="#16a34a" font-weight="600">W_aa</text>
<text x="182" y="126" font-size="10" text-anchor="start" fill="#16a34a" font-weight="600">W_ya</text>
<line x1="32" y1="322" x2="888" y2="322" stroke="#9ca3af" stroke-width="1"/>
<rect x="60" y="348" width="300" height="132" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="68" y="338" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">The same network, drawn rolled</text>
<rect x="164" y="392" width="92" height="56" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="210" y="423.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">RNN cell</text>
<rect x="175" y="456" width="70" height="22" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="210" y="470.78" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">x&lt;t&gt;</text>
<rect x="175" y="358" width="70" height="22" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="210" y="372.78" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;t&gt;</text>
<line x1="210" y1="454" x2="210" y2="450" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<line x1="210" y1="390" x2="210" y2="382" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<path d="M 256 420 C 306 420 306 372 268 392" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="300" y="440" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">delay of</text>
<text x="300" y="452" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one step</text>
<text x="420" y="372" font-size="11.5" text-anchor="start" fill="#111827" font-weight="600">What the picture says</text>
<text x="420" y="394" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">·  The cell scans left to right, one position at a time.</text>
<text x="420" y="411" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">·  Every step reuses the same three parameter matrices, so what</text>
<text x="420" y="428" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">    is learned at position 1 transfers to position 7.</text>
<text x="420" y="445" font-size="10.5" text-anchor="start" fill="#111827" font-weight="normal">·  y-hat&lt;3&gt; sees x&lt;1&gt;, x&lt;2&gt;, x&lt;3&gt; — but nothing after t = 3.</text>
<rect x="420" y="467" width="11" height="11" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.1"/>
<text x="436" y="476" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">input x&lt;t&gt;</text>
<rect x="525.1" y="467" width="11" height="11" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.1"/>
<text x="541.1" y="476" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">recurrent cell / a&lt;t&gt;</text>
<rect x="701.81" y="467" width="11" height="11" rx="2" fill="#fecaca" stroke="#dc2626" stroke-width="1.1"/>
<text x="717.81" y="476" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">output y-hat&lt;t&gt;</text>
</g>
</svg>
