<text x="330" y="96.96" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">y-hat&lt;2&gt;</text>
<rect x="286" y="140" width="88" height="66" rx="5" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
