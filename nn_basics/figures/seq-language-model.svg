<rect x="48" y="336" width="400" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="248" y="360" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="600">Each softmax is a 10,002-way distribution</text>
<text x="248" y="382" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">the 10,000 vocabulary words, plus UNK and &lt;EOS&gt;</text>
<text x="248" y="398" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">step 3 answers: P(any word  |  “cats average”)</text>
<rect x="472" y="336" width="400" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="672" y="360" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">Scoring a whole sentence</text>
<text x="672" y="384" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">P(y&lt;1&gt;, y&lt;2&gt;, y&lt;3&gt;)  =</text>
<text x="672" y="401" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">P(y&lt;1&gt;) · P(y&lt;2&gt; | y&lt;1&gt;) · P(y&lt;3&gt; | y&lt;1&gt;, y&lt;2&gt;)</text>
<text x="460" y="458" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">The loss is the softmax cross-entropy summed over steps. Tokenize first: build the vocabulary, map words to one-hot vectors, replace rare words with UNK, optionally append &lt;EOS&gt;.</text>
