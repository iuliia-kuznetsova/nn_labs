<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="760" height="320" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="380" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Computation graph for one example</text>
<text x="380" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">forward left to right; backprop walks the same edges in reverse</text>
<rect x="40" y="88" width="80" height="50" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="80" y="117" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">x</text>
<rect x="40" y="172" width="80" height="50" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="80" y="201" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">w, b</text>
<rect x="200" y="127" width="90" height="56" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="245" y="159" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">z</text>
<rect x="360" y="127" width="110" height="56" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="415" y="159" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">a = σ(z)</text>
<rect x="540" y="127" width="110" height="56" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="595" y="159" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal">ℒ(a, y)</text>
<line x1="128" y1="113" x2="192" y2="147" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="128" y1="197" x2="192" y2="163" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="298" y1="155" x2="352" y2="155" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="478" y1="155" x2="532" y2="155" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="532" y1="183" x2="478" y2="183" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="352" y1="183" x2="298" y2="183" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="192" y1="191" x2="128" y2="210" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="380" y="72" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="600">forward  →</text>
<text x="380" y="211" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">←  backward  (chain rule)</text>
<text x="380" y="292" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Each node is a tiny operation. Local derivatives multiply along the path; merging paths add.</text>
</g>
</svg>
