<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="ah-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
  <marker id="ah-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <marker id="ah-22c55e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
  </marker>
  <marker id="ah-ca8a04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ah-16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="ah-111827" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
  </marker>
  <marker id="ah-9ca3af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ah-db2777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
  </marker>
  <marker id="ah-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect width="900" height="382" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="450" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Why the bottleneck layer matters</text>
<text x="450" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">identical input and output dimensions, about one tenth of the computation</text>
<text x="30" y="78" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Naive: one 5×5 convolution</text>
<rect x="60" y="82" width="62" height="84" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="91" y="184" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×192</text>
<text x="91" y="198" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<line x1="128" y1="124" x2="236" y2="124" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="182" y="102" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">32 filters</text>
<text x="182" y="115" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">5×5×192</text>
<rect x="240" y="82" width="26" height="84" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="253" y="184" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×32</text>
<text x="253" y="198" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">output</text>
<rect x="324" y="102" width="236" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
<text x="442" y="120" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="normal">28·28·32  ×  5·5·192</text>
<text x="442" y="137" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">≈ 120 million multiplications</text>
<line x1="30" y1="214" x2="870" y2="214" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
<text x="30" y="244" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">With a 1×1 bottleneck</text>
<rect x="60" y="248" width="62" height="84" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="91" y="350" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×192</text>
<text x="91" y="364" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">input</text>
<line x1="128" y1="290" x2="174" y2="290" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="151" y="268" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">16 filters</text>
<text x="151" y="281" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">1×1×192</text>
<rect x="178" y="248" width="16" height="84" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="186" y="350" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×16</text>
<text x="186" y="364" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">bottleneck</text>
<line x1="200" y1="290" x2="248" y2="290" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="224" y="268" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">32 filters</text>
<text x="224" y="281" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">5×5×16</text>
<rect x="252" y="248" width="26" height="84" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="265" y="350" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×32</text>
<text x="265" y="364" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">output</text>
<rect x="324" y="258" width="236" height="76" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="442" y="277" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1 step ≈ 2.4 M   +   5×5 step ≈ 10.0 M</text>
<text x="442" y="296" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="600">≈ 12.4 million multiplications</text>
<text x="442" y="322" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">roughly 10× cheaper</text>
<rect x="594" y="148" width="276" height="112" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
<text x="732" y="174" font-size="10.8" text-anchor="middle" fill="#111827" font-weight="normal">The bottleneck is the narrowest</text>
<text x="732" y="191" font-size="10.8" text-anchor="middle" fill="#111827" font-weight="normal">part of the block: shrink the</text>
<text x="732" y="208" font-size="10.8" text-anchor="middle" fill="#111827" font-weight="normal">representation, convolve cheaply,</text>
<text x="732" y="225" font-size="10.8" text-anchor="middle" fill="#111827" font-weight="normal">then expand again. Within reason</text>
<text x="732" y="242" font-size="10.8" text-anchor="middle" fill="#111827" font-weight="normal">this does not hurt performance.</text>
</g>
</svg>
