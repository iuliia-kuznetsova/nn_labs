<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="880" height="360" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="440" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Intersection over Union</text>
<text x="440" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">how similar two boxes are — used for evaluation, NMS, and anchor assignment</text>
<rect x="80" y="110" width="180" height="130" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<text x="88" y="128" font-size="11" text-anchor="start" fill="#dc2626" font-weight="600">predicted</text>
<rect x="160" y="150" width="180" height="120" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="332" y="260" font-size="11" text-anchor="end" fill="#2563eb" font-weight="600">ground truth</text>
<rect x="160" y="150" width="100" height="90" rx="0" fill="#86efac" stroke="none" stroke-width="0"/>
<text x="210" y="199" font-size="16" text-anchor="middle" fill="#16a34a" font-weight="600">∩</text>
<rect x="420" y="86" width="420" height="200" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="440" y="116" font-size="14" text-anchor="start" fill="#111827" font-weight="600">IoU  =  area of ∩  /  area of ∪</text>
<text x="440" y="148" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">intersection  =  100 × 90</text>
<text x="440" y="172" font-size="12" text-anchor="start" fill="#111827" font-weight="normal">union  =  A + B − intersection</text>
<text x="440" y="204" font-size="13" text-anchor="start" fill="#16a34a" font-weight="600">A detection is correct if  IoU ≥ 0.5</text>
<text x="440" y="228" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">0.5 is a convention, not a theorem. 0.6 or 0.7 is stricter.</text>
<text x="440" y="256" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">Perfect overlap  →  IoU = 1, because ∩ = ∪.</text>
<text x="440" y="342" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">IoU shows up three times: scoring a predicted box, deciding which boxes non-max suppression should kill, and matching objects to anchor shapes.</text>
</g>
</svg>
