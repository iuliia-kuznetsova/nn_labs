<text x="471" y="410" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">reject the sample and redraw from the </text>
<text x="471" y="424" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">rest of the vocabulary</text>
<rect x="628" y="366" width="274" height="74" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
