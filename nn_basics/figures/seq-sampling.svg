<text x="177" y="390" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="600">When to stop</text>
<text x="177" y="410" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">sample until &lt;EOS&gt;, or fix a length of</text>
<text x="177" y="424" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal"> 20 or 100 steps</text>
<rect x="334" y="366" width="274" height="74" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.4"/>
