<text x="520" y="92" font-size="12" text-anchor="start" fill="#dc2626" font-weight="600">Cell (2, 2) is hit by every stamp</text>
<text x="520" y="118" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="normal">from 1:  1 × filter[2, 2]  =  −1</text>
<text x="520" y="138" font-size="11.5" text-anchor="start" fill="#ca8a04" font-weight="normal">from 2:  2 × filter[2, 0]  =  −2</text>
<text x="520" y="158" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="normal">from 3:  3 × filter[0, 2]  =  +3</text>
<text x="520" y="178" font-size="11.5" text-anchor="start" fill="#2563eb" font-weight="normal">from 4:  4 × filter[0, 0]  =  +4</text>
<line x1="520" y1="198" x2="770" y2="198" stroke="#111827" stroke-width="1"/>
<text x="520" y="220" font-size="13" text-anchor="start" fill="#dc2626" font-weight="600">−1  −  2  +  3  +  4   =   4</text>
<text x="520" y="258" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">Cell (4, 2) is hit by only 3 and 4</text>
<text x="520" y="280" font-size="13" text-anchor="start" fill="#2563eb" font-weight="600">−3  +  (−4)   =   −7</text>
<text x="460" y="318" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Never overwrite. If two (or four) stamps land on the same cell, the values are added.</text>
