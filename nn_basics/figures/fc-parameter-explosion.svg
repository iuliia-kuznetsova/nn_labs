<rect width="880" height="356" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="440" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Why a fully connected first layer does not scale to images</text>
<text x="440" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the input dimension grows with the square of the image side</text>
<rect x="78" y="86" width="44" height="44" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="100" y="148" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">64 × 64 × 3</text>
<line x1="150" y1="108" x2="196" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="173" y="96" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="200" y="90" width="116" height="36" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="258" y="113" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">12,288</text>
<text x="258" y="142" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input features</text>
<line x1="322" y1="108" x2="368" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="345" y="96" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">dense</text>
<rect x="372" y="90" width="168" height="36" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="456" y="113" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">1,000 × 12,288</text>
<text x="456" y="142" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">shape of W</text>
<line x1="546" y1="108" x2="592" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="596" y="88" width="168" height="40" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="680" y="114" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="600">12.3 million</text>
<text x="680" y="142" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">parameters in one layer</text>
<rect x="54" y="170" width="92" height="92" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="100" y="280" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">1000 × 1000 × 3</text>
<line x1="150" y1="216" x2="196" y2="216" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="173" y="204" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">flatten</text>
<rect x="200" y="198" width="116" height="36" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.4"/>
<text x="258" y="221" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">3,000,000</text>
<text x="258" y="250" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">input features</text>
<line x1="322" y1="216" x2="368" y2="216" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="345" y="204" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">dense</text>
<rect x="372" y="198" width="168" height="36" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
<text x="456" y="221" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">1,000 × 3,000,000</text>
<text x="456" y="250" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">shape of W</text>
<line x1="546" y1="216" x2="592" y2="216" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="596" y="196" width="168" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="680" y="222" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="600">3 billion</text>
<text x="680" y="250" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">parameters in one layer</text>
<text x="440" y="310" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Three billion parameters in a single layer is infeasible to regularize, to store, and to compute with —</text>
<text x="440" y="326" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">and that is for a one-megapixel image with only 1,000 hidden units.</text>
<text x="440" y="348" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">A convolutional layer replaces W entirely with a small filter reused at every position.</text>
</g>
</svg>
