<rect width="920" height="460" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Convolutional implementation of sliding windows</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one forward pass over the whole image evaluates every window, with the overlapping computation shared</text>
<text x="40" y="70" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Naive: four independent 14×14 crops</text>
<rect x="40" y="86" width="70" height="70" rx="3" fill="#f3f4f6" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="58" y="86" width="70" height="70" rx="3" fill="#f3f4f6" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="40" y="104" width="70" height="70" rx="3" fill="#f3f4f6" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="58" y="104" width="70" height="70" rx="3" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="75" y="188" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">16×16 image, stride 2</text>
<text x="75" y="204" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">4 ConvNet passes, mostly duplicated</text>
<line x1="160" y1="140" x2="210" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<rect x="230" y="96" width="32" height="32" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="246" y="116" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">4</text>
<rect x="262" y="96" width="32" height="32" rx="2" fill="#ffffff" stroke="#ca8a04" stroke-width="1.8"/>
<text x="278" y="116" font-size="12" text-anchor="middle" fill="#ca8a04" font-weight="600">4</text>
<rect x="230" y="128" width="32" height="32" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="246" y="148" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="600">4</text>
<rect x="262" y="128" width="32" height="32" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="278" y="148" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="600">4</text>
<text x="262" y="178" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">one 1×1×4 slice per window</text>
<text x="520" y="140" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Convolutional: the same four results, one pass</text>
<text x="520" y="162" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">Each coloured cell is the softmax the 14×14 net would have</text>
<text x="520" y="178" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal">produced on that crop — computed together, not four times.</text>
<polygon points="28,273 36.302,267.912 110.302,267.912 102,273" fill="#eceef1" stroke="#6b7280" stroke-width="1.15"/>
<polygon points="102,273 110.302,267.912 110.302,341.912 102,347" fill="#c3c6cc" stroke="#6b7280" stroke-width="1.15"/>
<polygon points="28,273 102,273 102,347 28,347" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="65" y="313.6" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">Input</text>
<text x="65" y="363" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">16×16×3</text>
<polygon points="202.21,276.648 212.516,270.331 279.22,270.331 268.914,276.648" fill="#cef9dd" stroke="#16a34a" stroke-width="1.15"/>
<polygon points="268.914,276.648 279.22,270.331 279.22,337.035 268.914,343.352" fill="#a0d3b5" stroke="#16a34a" stroke-width="1.15"/>
<polygon points="202.21,276.648 268.914,276.648 268.914,343.352 202.21,343.352" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="235.562" y="313.6" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">CONV</text>
<text x="235.562" y="359.352" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">12×12×16</text>
<polygon points="371.128,282.934 381.435,276.617 435.566,276.617 425.26,282.934" fill="#d1e5fe" stroke="#2563eb" stroke-width="1.15"/>
<polygon points="425.26,282.934 435.566,276.617 435.566,330.749 425.26,337.066" fill="#a3bcdc" stroke="#2563eb" stroke-width="1.15"/>
<polygon points="371.128,282.934 425.26,282.934 425.26,337.066 371.128,337.066" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.3"/>
<text x="398.194" y="313.6" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">POOL</text>
<text x="398.194" y="353.066" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">6×6×16</text>
<polygon points="527.474,288.335 548.554,275.415 591.885,275.415 570.805,288.335" fill="#a8f3c3" stroke="#15803d" stroke-width="1.15"/>
<polygon points="570.805,288.335 591.885,275.415 591.885,318.745 570.805,331.665" fill="#73cd97" stroke="#15803d" stroke-width="1.15"/>
<polygon points="527.474,288.335 570.805,288.335 570.805,331.665 527.474,331.665" fill="#86efac" stroke="#15803d" stroke-width="1.3"/>
<text x="549.14" y="313.06" font-size="8.5" text-anchor="middle" fill="#111827" font-weight="600">CONV</text>
<text x="549.14" y="347.665" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">2×2×400</text>
<polygon points="683.793,288.335 704.873,275.415 748.203,275.415 727.123,288.335" fill="#e6fdee" stroke="#22c55e" stroke-width="1.15"/>
<polygon points="727.123,288.335 748.203,275.415 748.203,318.745 727.123,331.665" fill="#bcd8c8" stroke="#22c55e" stroke-width="1.15"/>
<polygon points="683.793,288.335 727.123,288.335 727.123,331.665 683.793,331.665" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
<text x="705.458" y="313.06" font-size="8.5" text-anchor="middle" fill="#111827" font-weight="600">CONV</text>
<text x="705.458" y="347.665" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">2×2×400</text>
<polygon points="840.111,288.335 848.67,283.089 892,283.089 883.442,288.335" fill="#fed9d9" stroke="#dc2626" stroke-width="1.15"/>
<polygon points="883.442,288.335 892,283.089 892,326.42 883.442,331.665" fill="#d8aeb0" stroke="#dc2626" stroke-width="1.15"/>
<polygon points="840.111,288.335 883.442,288.335 883.442,331.665 840.111,331.665" fill="#fecaca" stroke="#dc2626" stroke-width="1.3"/>
<text x="861.777" y="313.06" font-size="8.5" text-anchor="middle" fill="#111827" font-weight="600">Output</text>
<text x="861.777" y="347.665" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="600">2×2×4</text>
<line x1="111.302" y1="310" x2="199.21" y2="310" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="156.256" y="291" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">convolution 5×5×3,</text>
<text x="156.256" y="302" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">16 filters</text>
<line x1="280.22" y1="310" x2="368.128" y2="310" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="325.174" y="291" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">max pool</text>
<text x="325.174" y="302" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">f=2, s=2</text>
<line x1="436.566" y1="310" x2="524.474" y2="310" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="481.52" y="291" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">convolution 5×5×16,</text>
<text x="481.52" y="302" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">400 filters</text>
<line x1="592.885" y1="310" x2="680.793" y2="310" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="637.839" y="291" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">convolution 1×1×400,</text>
<text x="637.839" y="302" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">400 filters</text>
<line x1="749.203" y1="310" x2="837.111" y2="310" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah-9ca3af)"/>
<text x="794.157" y="291" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">convolution 1×1×400,</text>
<text x="794.157" y="302" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="normal">4 filters</text>
<text x="460" y="424" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">A 28×28 image through the same net gives 8×8×4 — 64 windows in one pass. The effective stride is the network's downsampling (here, 2).</text>
<text x="460" y="440" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">This fixes the cost. It does not fix the boxes: they are still stuck to the discrete window grid and the window's aspect ratio.</text>
</g>
</svg>
