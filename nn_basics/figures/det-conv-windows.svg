<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Convolutional implementation of sliding windows</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one forward pass over the whole image evaluates every window, with the overlapping computation shared</text>
<text x="196" y="72" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">Naive: four independent 14×14 crops</text>
<rect x="56" y="92" width="84" height="84" rx="3" fill="#f3f4f6" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="74" y="92" width="84" height="84" rx="3" fill="#f3f4f6" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="56" y="110" width="84" height="84" rx="3" fill="#f3f4f6" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="74" y="110" width="84" height="84" rx="3" fill="#f3f4f6" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="116" y="210" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">16×16 image, stride 2</text>
<text x="116" y="228" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">4 ConvNet passes, mostly duplicated</text>
<line x1="214" y1="150" x2="268" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="241" y="124" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">same</text>
<text x="241" y="137" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">weights</text>
<text x="560" y="72" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">Convolutional: one pass, 2×2×4 output</text>
<rect x="280" y="108" width="72" height="72" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="316" y="196" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">16×16×3</text>
<rect x="372" y="116" width="60" height="56" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
<text x="402" y="188" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">12×12×16</text>
<rect x="452" y="124" width="48" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
<text x="476" y="180" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">6×6×16</text>
<rect x="520" y="128" width="40" height="32" rx="3" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="540" y="176" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">2×2×400</text>
<rect x="580" y="128" width="40" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="600" y="176" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">2×2×400</text>
<rect x="640" y="128" width="40" height="32" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
<text x="660" y="176" font-size="10" text-anchor="middle" fill="#111827" font-weight="600">2×2×4</text>
<line x1="354" y1="144" x2="370" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="434" y1="144" x2="450" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="502" y1="144" x2="518" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="562" y1="144" x2="578" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="622" y1="144" x2="638" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="710" y="108" width="28" height="28" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="724" y="126" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">4</text>
<rect x="738" y="108" width="28" height="28" rx="2" fill="#ffffff" stroke="#ca8a04" stroke-width="1.8"/>
<text x="752" y="126" font-size="11" text-anchor="middle" fill="#ca8a04" font-weight="600">4</text>
<rect x="710" y="136" width="28" height="28" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="724" y="154" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="600">4</text>
<rect x="738" y="136" width="28" height="28" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="752" y="154" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="600">4</text>
<text x="738" y="182" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">one 1×1×4 per window</text>
<text x="460" y="352" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Each 1×1×4 slice is exactly the softmax the original 14×14 network would have produced on that crop.</text>
<text x="460" y="368" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">A 28×28 image through the same net gives 8×8×4 — 64 windows in one pass. The effective stride is the network's downsampling (here, 2).</text>
<text x="460" y="384" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">This fixes the cost. It does not fix the boxes: they are still stuck to the discrete window grid and the window's aspect ratio.</text>
</g>
</svg>
