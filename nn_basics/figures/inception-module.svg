<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 422" width="940" height="422">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="940" height="422" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="470" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">The full Inception module (GoogLeNet inception-3a)</text>
<text x="470" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">1×1 bottlenecks shrink the channels before the expensive convolutions</text>
<rect x="56" y="150" width="84" height="132" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="98" y="212" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">input</text>
<text x="98" y="225" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">28×28×192</text>
<line x1="144" y1="216" x2="246" y2="123" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="250" y="92" width="150" height="62" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="325" y="115" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1 conv</text>
<text x="325" y="127" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">64 filters</text>
<text x="325" y="139" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×64</text>
<line x1="404" y1="123" x2="635" y2="123" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="640" y="92" width="84" height="62" rx="0" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="682" y="127" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">64</text>
<line x1="144" y1="216" x2="246" y2="185" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="250" y="154" width="150" height="62" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="325" y="183" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">1×1 conv</text>
<text x="325" y="195" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">96 filters</text>
