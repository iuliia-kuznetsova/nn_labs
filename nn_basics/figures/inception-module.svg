<text x="501" y="201" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×128</text>
<line x1="580" y1="185" x2="635" y2="216" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="640" y="154" width="84" height="124" rx="0" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
