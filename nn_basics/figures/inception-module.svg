<text x="325" y="257" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">16 filters</text>
<line x1="403" y1="247" x2="423" y2="247" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="426" y="216" width="150" height="62" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.4"/>
<text x="501" y="239" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">5×5 conv, same</text>
<text x="501" y="251" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">32 filters</text>
<text x="501" y="263" font-size="10.5" text-anchor="middle" fill="#111827" font-weight="normal">→ 28×28×32</text>
<line x1="580" y1="247" x2="635" y2="293.5" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="640" y="278" width="84" height="31" rx="0" fill="#86efac" stroke="#15803d" stroke-width="1.2"/>
