<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 438" width="920" height="438">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="920" height="438" fill="#ffffff"/>
<g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#111827" font-size="12">
<text x="460" y="24" font-size="15" text-anchor="middle" fill="#111827" font-weight="600">Convolution over a volume</text>
<text x="460" y="42" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">the filter must match the input's channel count, and the output's channel count is the number of filters</text>
<rect x="30" y="72" width="860" height="152" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="38" y="62" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">One 3×3×3 filter</text>
<rect x="90" y="102" width="62" height="62" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="82" y="110" width="62" height="62" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="74" y="118" width="62" height="62" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="105" y="210" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">6×6×3</text>
<text x="196" y="156" font-size="20" text-anchor="middle" fill="#6b7280" font-weight="normal">∗</text>
<rect x="238" y="120" width="34" height="34" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="232" y="126" width="34" height="34" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="226" y="132" width="34" height="34" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="243" y="210" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">3×3×3</text>
<text x="310" y="156" font-size="20" text-anchor="middle" fill="#6b7280" font-weight="normal">=</text>
<rect x="338" y="122" width="46" height="46" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="361" y="210" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">4×4×1</text>
<text x="440" y="128" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">The filter has 3 · 3 · 3 = 27 numbers.</text>
<text x="440" y="150" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">At each position all 27 products are added into a single value,</text>
<text x="440" y="172" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">so the channel axis collapses: the output is 4×4×1, not 4×4×3.</text>
<text x="440" y="200" font-size="11" text-anchor="start" fill="#111827" font-weight="600">One filter detects one feature.</text>
<rect x="30" y="258" width="860" height="152" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="38" y="248" font-size="12.5" text-anchor="start" fill="#111827" font-weight="600">Two 3×3×3 filters</text>
<rect x="90" y="288" width="62" height="62" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="82" y="296" width="62" height="62" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<rect x="74" y="304" width="62" height="62" rx="2" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.3"/>
<text x="105" y="396" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">6×6×3</text>
<text x="196" y="342" font-size="20" text-anchor="middle" fill="#6b7280" font-weight="normal">∗</text>
<rect x="234" y="306" width="34" height="34" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="228" y="312" width="34" height="34" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="222" y="318" width="34" height="34" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="280" y="306" width="34" height="34" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.3"/>
<rect x="274" y="312" width="34" height="34" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.3"/>
<rect x="268" y="318" width="34" height="34" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.3"/>
<text x="258" y="396" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">2 filters of 3×3×3</text>
<text x="346" y="342" font-size="20" text-anchor="middle" fill="#6b7280" font-weight="normal">=</text>
<rect x="383" y="305" width="46" height="46" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<rect x="374" y="314" width="46" height="46" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
<text x="400" y="396" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">4×4×2</text>
<text x="470" y="314" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">Each filter produces its own 4×4 map; stacking the two maps</text>
<text x="470" y="336" font-size="11" text-anchor="start" fill="#111827" font-weight="normal">along the channel axis gives 4×4×2.</text>
<text x="470" y="364" font-size="11" text-anchor="start" fill="#111827" font-weight="600">The output's last dimension is the number of filters —</text>
<text x="470" y="384" font-size="11" text-anchor="start" fill="#111827" font-weight="600">not the number of input channels. 128 filters give 4×4×128.</text>
<text x="460" y="428" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">n × n × nC  ∗  {nC′ filters of f × f × nC}  =  (n − f + 1) × (n − f + 1) × nC′</text>
</g>
</svg>
